  <script>window.TC9_CHAPTERS=[
  {
    "n": 1,
    "title": "Introduction to Cost Accounting",
    "difficulty": "Foundation",
    "time": "55–80 min",
    "examValue": "High",
    "memory": "Think: WHO uses the information, WHAT is being costed, and HOW the cost behaves.",
    "coverage": [
      "Financial accounting vs management accounting",
      "Meaning and functions of cost accounting",
      "Management information systems",
      "Cost object, cost unit and cost centre",
      "Elements of cost: materials, labour, expenses",
      "Direct and indirect costs; prime cost and overhead",
      "Product costs and period costs",
      "Cost behaviour: fixed, variable and mixed",
      "Relevant range",
      "Cost estimation: scattergraph, regression and high–low"
    ],
    "lessons": [
      {
        "title": "1. Where cost accounting fits",
        "text": "Financial accounting mainly reports past performance to external users. Management accounting supports internal planning, control and decisions. Cost accounting supplies detailed cost information to management: what a product, service, department or activity costs and why."
      },
      {
        "title": "2. Cost object, cost unit and cost centre",
        "text": "A cost object is anything whose cost you want to know. A cost unit is the unit in which that cost is measured, such as one patient-day or one unit produced. A cost centre is the location, department, machine or activity where costs are collected before they are assigned to cost units."
      },
      {
        "title": "3. Direct versus indirect cost",
        "text": "Direct costs can be traced economically to a specific cost unit. Indirect costs cannot be traced economically and are treated as overhead. Prime cost is direct material + direct labour + direct expenses."
      },
      {
        "title": "4. Cost behaviour",
        "text": "Variable cost changes in total with activity while variable cost per unit is normally constant. Fixed cost stays constant in total within the relevant range while fixed cost per unit changes. A mixed cost contains both fixed and variable parts."
      },
      {
        "title": "5. High–low method",
        "text": "Choose the highest and lowest ACTIVITY levels, not the highest and lowest costs. Variable cost per unit = change in total cost ÷ change in activity. Fixed cost = total cost − variable cost for that activity. Then write y = a + bx."
      }
    ],
    "formulas": [
      [
        "Mixed cost equation",
        "y = a + bx"
      ],
      [
        "High–low variable rate",
        "b = (High cost − Low cost) ÷ (High activity − Low activity)"
      ],
      [
        "Fixed cost",
        "a = Total cost − (b × activity)"
      ],
      [
        "Prime cost",
        "Direct material + Direct labour + Direct expenses"
      ]
    ],
    "flashcards": [
      [
        "Financial accounting vs management accounting?",
        "Financial accounting mainly serves external users and reports past performance; management accounting serves internal managers for planning, control and decision-making."
      ],
      [
        "What is a cost object?",
        "Anything for which management wants to measure cost, such as a product, service, customer, department or project."
      ],
      [
        "Cost unit?",
        "A unit of product or service in relation to which costs are ascertained or accumulated."
      ],
      [
        "Cost centre?",
        "A location, function, department, machine or activity where costs are collected."
      ],
      [
        "Direct cost?",
        "A cost that can be traced economically to a specific cost unit."
      ],
      [
        "Product cost vs period cost?",
        "Product cost is included in inventory until sale; period cost is written off in the period incurred."
      ],
      [
        "What stays constant for a variable cost?",
        "Variable cost per unit, within the relevant range."
      ],
      [
        "What stays constant for a fixed cost?",
        "Total fixed cost, within the relevant range."
      ],
      [
        "High–low: what do you choose?",
        "The highest and lowest ACTIVITY levels, not the highest and lowest total costs."
      ]
    ],
    "videos": [
      [
        "Managerial Accounting & Cost Accounting",
        "https://www.youtube.com/watch?v=Zc6kjZHpvAk",
        "Use the cost classification, product/period cost, mixed-cost and high–low sections as a broad backbone."
      ],
      [
        "Variable Costs — Edspira",
        "https://www.youtube.com/watch?v=0Nmvjvhdex8",
        "Clear explanation of variable-cost behaviour."
      ],
      [
        "High–Low Method",
        "https://www.youtube.com/watch?v=boXIngkK-iA",
        "Use after learning cost behaviour to practise mixed-cost separation."
      ]
    ],
    "examChecklist": [
      "Can I distinguish financial from management accounting?",
      "Can I explain cost object, cost unit and cost centre with examples?",
      "Can I classify direct/indirect and product/period costs?",
      "Can I separate a mixed cost using high–low?",
      "Can I explain the relevant range?"
    ]
  },

oduct can be recognized in different ways as follows: \n \n (1) It may be added to the sales from the main product. \n \n \n (2) It may be treated as a separate incidental source of income. \n\n (3) It may be deducted from the production cost of sales of the main \n Product. \n \n(4) Deducting the net realizable value of the by -product from the \nproduction cost of the main product. \n \n (d) (i) Wages variable cost per unit = K(17,200-16,000)/(6,0000-5,000) \n = K1.20 \n \n (ii) Wages fixed cost = K16,000-(5,000x1.2) \n = K10,000 \n \n Alternatively: \n = K17,200-(6,000x1.2) \n = K10,000 \n \n (iii) Wages at 6,200 units = K10,000+(6,200xK1.2) \n = K17,440 \n (iv) Material cost per unit = K(25,000/5,000) \n = K5 \n \n (v) Depreciation at 10,000 units = K18,000 (being a fixed cost, \n It doesn’t change)",

    "question": "5 (a) Explain any three uses of standards in the context of standard costing. 6 Marks \n \n (b) Explain any four limitations of breakeven analysis as a decision making tool. \n 4 Marks \n \n (c) Explain any four advantages of absorption costing. 4 Marks \n \n (d) Explain the impact of absorption costing on each of the following: \n \n(i) Inventory valuation. 2 Marks \n(ii) Product pricing. 2 Marks \n(iii) Profit measurement. 2 Marks \n(TOTAL: 20 MARKS) \n \n \nEND",
    "answer": "5 (a) Uses of standards \n \n(i) Provides a formal basis for assessing performance and efficiency – The \ncomparison of actual costs enables the management to evaluate \nperformance of various cost centres. In the absence of standard costing \nsystem, actual costs of different period may be compared to measure \nefficiency. It is not proper to compare costs of different period because \n\ncircumstance of both the periods may be different. Still, a decision about \nbase period can be made with which actual performance can be \ncompared. \n \n(ii) Finding variances – The performance variances \n \n(iii) are determined by comp aring actual costs with standard costs. \nManagement is able to spot out the place of inefficiencies. It can assign \nresponsibility for deviation in performance. It is possible to take \ncorrective measures at the earliest. \n \n(iv) Management by exception – The tar gets of different individuals are \nfixed if the performance is according to predetermined standards. The \nattention of management is drawn only when actual performance is \noutside the standard. \n \n(v) Cost control – Every costing system aims at cost control and co st \nreduction. The standards are being constantly analysed and an effort is \nmade to improve efficiency. Whenever a variance occurs, the reasons \nare studied and immediate corrective measures are undertaken. The \naction taken in spotting weak points enables cost control system. \n \n(vi) Eliminating inefficiencies – The setting of standards for different \nelements of cost requires a detailed study of different aspects. The \nstandards are set differently for manufacturing administrative and \nselling expenses. Improved methods are used for se tting these \nstandards. The determination of manufacturing expenses will require \ntime and motion study for labour and effective material control devices \nfor materials. Similar studies will be needed for finding other expenses. \nAll these studies will make it possible to eliminate inefficiencies at \ndifferent steps. \n \n \n \n \n \n \n \n \n(b) Limitations of breakeven analysis \n \n(i) It applies to a single product or a single product mix only. This restricts \nits usefulness to those firms which may be producing more than one \nproduct or product mix. \n \n(ii) It assumes that fixed costs are the same in total and variable costs are \nthe same per unit at all levels of output. This assumption is a real \nsimplification when it comes to real life. \n \n(iii) It assumes that the sales price will be constant at all levels of activity. \nThis may not be true, specially at higher volumes of output, where the \nprice may have to be reduced to win extra sales. \n\n(iv) Production and sales are assumed to be the same. Therefor e, the \nconsequences of any increase in stock (when production volumes \nexceed sales) or ‘de -stocking’ (when sales volumes exceed production \nlevels) are ignored. \n \n(v) Uncertainty in the estimates of fixed cost and unit variable costs is often \nignored in breakeven analysis, and some costs, e.g. mixed costs and step \ncosts, are not always easily categorized or divided into fixed and \nvariable. \n \n (c) Advantages of absorption costing are as follows: \n \n(i) Fixed costs are substantial and increasing proportion of costs in modern \nindustry. Production cannot be achieved without incurring fixed costs \nwhich thus form an inescapable part of the cost of production. As such, \nthey should be included in stock valuations. \n \n(ii) When production is constant but sales fluctuate, net profit fluctuations \nare less with absorption costing than marginal costing. \n \n(iii) Where stock building is a necessary part of operations, the inclusion of \nfixed costs in stock valuation is necessary and desirable; otherwise a \nseries of fic titious losses will be shown in earlier periods to be offset \neventually by excessive profits when the goods are sold. \n \n(iv) The inclusion of fixed costs in production cost enables proper and \ncorrect pricing decisions to be made – price which recovers all costs. \n \n(v) Accounting standard on stoc k valuation recommends the use of \nabsorption costing for financial accounts because costs and revenues \nmust be matched in the period when the revenue arises not when the \ncosts are incurred. It also recommends that stock valuations must \ninclude production overhead incurred in the normal course of business \neven if such overheads are fixed. \n \n \n(d) (i) Inventory valuation : all costs inc urred in the conversion process are \n included in the product c ost – meaning that all indirect costs are \n attributed to cost units thereby increasing the cost of Inventory. \n \n(ii) Product pricing: where the total product cost is used as the basis for \npricing as cost recovery basis, the selling price is established by adding \na profit mark up to the total cost. This means the selling price set ensures \nrecovery of all costs – hence is usually high. \n \n(iii) Profitability measurement: profit is calculated after taking out overheads \nrecovered through closing inventory. Since the closing inventory \nincludes some fixed costs, the s ubtraction of closing inventory leads to \nlower profit.",

ing different calculations and the interpretations of those calculations. Tuition providers should take time to train and prepare candidates to handle requirements in their contexts – not memorizing. Use of past papers should be a guide – not to be memorized. The subject requires a lot of practice and tuition 9 providers need to ensure that enough time is devoted to that. Both candidates and tuition providers are strongly encouraged to read Examiners’ reports and address the areas of improvement highlighted therein. It is even better for tuition providers (lecturers) when revising past papers to be looking at the examiner’s report for that paper at the same time to highlight to candidates the kind of mistakes to be avoided when tack ling the question of that kind in future examinations.",

    "answer": "1 (a) (i) Joint products have relatively high sales value whereas by-products have \na low sales value compared with the sales value of a joint product which \nat times have no value at all. \n \n(ii) Joint products are crucial to the commercial viability of an organizatio n \nas they are intended to be produced by the organization while by -\nproducts are just incidental. \n \n(iii) At times, joint products require further processing to turn them into final \nproducts or to add more value, if need be. On the other hand, by \nproducts are in no way processed any further. \n \n \n(b) (i) Cost unit – this is unit of a product or service in relation to which costs \n are ascertained/accumulated. It is important to understand a cost unit \n as it will be the focal point for allocating costs as they are incurred. \n \n \n(ii) Variable costs – these are costs which vary in direct pro portion to the \nvolume of production or level of activity. The significance of these costs \ncomes in several areas including understanding the effect on total costs \nof increasing production and determining prime costs of products. \n \n \n(c) (i) Attributable fixed costs vary between alternatives – hence relevant for \n decisions making. \n \n(ii) Decisions that are made using fixed costs and variable costs are \ndifferent. In some cases, fixed costs may not be relevant for decision \nmaking when they are the same between alternatives while variable \ncosts are relevant in the context. \n \n(iii) A relevant cost is that cost which affects the decision to be made and is \ntherefore used in making the decision. \n \n (d) (i) Sales budget = 200,000 x K30 \n = K6,000,000 \n \n (ii) Production budget \n \n Units to be sold 200,000 \n Add planned closing stock 10,000 \n 210,000 \n Less planned opening stock (40,000) \n Units to be produced 170,000 \n \n \n \n \n\n (iii) Material Usage budget \n \n Material X = 170,000 x 20 \n = 3,400,000 kg \n \n Material Y = 170,000 x 30 \n = 5,100,000 kg \n \n \n (iv) Material Purchase Budget \n \n Material X Material Y \nQuantity required to meet production 3,400,000 5,100,000 \nAdd: planned closing stock 2,000 1,000 \n 3,402,000 5,101,000 \nLess: planned opening stock (10,000) (8,000) \n 3,392,000 5,093,000 \nAdd: provision for loss 500 300 \n 3,392,500 5,093,300 \nCost per Kg K5 K4 \nTotal purchases K16,962,500 K20,373,200",

    "examinerNote": "Part (a) required candidates to state differences between a joint product and a by-product. Candidates mentioned the differences in terms of definitions while some merely talked about how they are separated in process costing. In other cases, candidates explained the accounting treatment of revenue realized from joint products instead of providing the differences. Part (b) required candidates to explain the importance of understanding a cost unit and variable costs in costing. Some candidates just defined the terms without s tating anything in terms of the importance of understa nding those terms. In some cases, candidates confused cost unit with unit cost and explained the importance of understanding the concept from pricing perspective instead of cost ascertainment. In such cases, candidates clearly knew fixed cost but could not demonstrate the importance of understanding such costs. Part (c)(i) required candidates to explain, in the context of dec ision making, why attributable fixed costs are relevant for decision making. Most candidates display ed lack of understanding as to what attributable fixed costs are. They stated that attributable fixed costs are relevant for decision making because they change in the long run or that they vary with the level of activity. Neither of these makes fixed costs relevant for decision making. What really makes attributable fixed costs relevant for decision making is the fact that they vary, meaning that they are not the same , for the alternatives under consideration. In part (c)(ii), on the importance of separating fixed costs from variable costs in a semi fixed cost in the context of decision making , candidates explained what a fixed cost is, while in other cases they explained the high-low method that is used in separating fixed costs and variable costs in a semi fixed cost. The separation of fixed costs and variable costs in a semi fixed cost informs the decision making process as the decisions made based on these two types of costs are not the same. Candidates on the other hand were able to explain what the relevant cost is in the context of decision making which was the requirement in part (c)(iii). Part (d) was about budgeting with part (i) asking for sal es budget. Most candidates did well here on the calculation of the sales budget. Problems arose from (ii) on the computation of the production budget in units. The major challenge was on the treatment of closing stock and opening stock. Instead of adding b ack closing stock and subtracting the opening stock, candidates did the opposite as if they were calculating cost of sales. By getting the production budget wrong , candidates could not g et the material usage budget and the material purchase budget correct, which were the requirements in (iii) and (iv). However, marks were still awarded to candidates who demonstrated knowledge and understanding on the calculation of material usage and material purchases budgets. On the calculation of the material purchase budget , there were two key issues: treatment of the planned closing and opening stock , which suffered the same problem as in the calculation of the production budget, and failure to add planned provision for loss. Candidates failed to appreciate the fact that on raw materials, there was a provision for loss in the next year’s budget. The provision for loss meant that some of the materials were going to be lost and therefore not to be used for production. As such , when it comes to procurement, the company needs to procure more materials bearing in mind that some will be lost. This is where the provisions for loss were supposed to be added to the material purchases budget for each material type.",

    "question": "2 (a) Explain the importance of each of the following characteristics of information \n for decision making: \n \n(i) Relevance 2 Marks \n(ii) Timeliness 2 Marks \n(iii) Understandable 2 Marks \n(iv) Accurate 2 Marks \n(v) Completeness 2 Marks \n \n(b) Two products, X and Y, are produced from the same material. The material \ncosts K950 per kg and the products appear after process 1. \n \n Product X can be sold directly but Y needs further processing in Process 2. The \nfollowing data relate to the most recent period: \n \n Materials Labour Overheads Total \n K’000 K’000 K’000 K’000 \nProcess 1 1,440 210 150 1,800 \nProcess 2 - 100 180 280 \n 1,440 310 330 2,080 \n \n Sales (kgs) Closing stock(kgs) Sales value \nProduct X 300,000 150,000 K525,000 \nProduct Y 450,000 - K1,507,500 \n \n There were no materials on hand at the end of the period. \n \n Required \n \n Calculate the following \n \n(i) The unit price of product X and its market value at split-off point. \n3 Marks \n \n(ii) Total joint costs to be apportioned between the two products and \nnotional sales values at split-off point. 2 Marks \n \n(iii) Total cost of products X and Y using the sales value method of \napportionment. 5 Marks \n(TOTAL: 20 MARKS)",
    "answer": "2 (a) (i) Relevant – it is only information which speaks to or, is appropriate for \n or is in synch with the decision at hand that can be used to make the \n decision. \n \n(ii) Timeliness – information can only be used for decision making when it \nis provided as and when it is needed. Information loses value when \nprovided late, hence cannot be used for decision making. \n \n(iii) Understandable – the user of the information needs to understand the \ninformation for him/her to make the correct decision. If informatio n \ncannot be understood by the user, either wrong decisions or no decision \nat all can be made out of the information. \n \n(iv) Accurate – information with errors in it can be misleading and can result \ninto wrong decision made out of it. \n \n(v) Completeness – it is information which contains all the relevant facts \nthat can be used to make decis ions. If some facts are missing, the \ninformation may as well be misleading, leading to wrong decisions \nmade. \n \n \n \n \n \n \n\n (b) (i) Price per unit = Sales = 525,000 = K1.75 \n Kgs sold 300,000 \n \n (ii) Joint costs to be apportioned are process 1 costs \n \n Total notional sales value at split-off point: \n K \n Product X 787,500 (as in (i) above \n Product Y (K1,507,500-K280,000) 1,227,500 \n 2,015,000 \n \n \n (iii) \n Notional Joint costs Post split Total costs \n Sales apportioned off costs \n K K K K \nProduct X 787,500 703,4702(W1) - 703,740 \nProduct Y 1,227,500 1,096,5302(W2) 280,000 1,376,530 \n 2,015,000 1,800,000 280,000 2,080,000 \n \nW1: Apportioned costs for X = 787,500 x 1,800,000 = K703,470 \n 2,015,000 \n \nW2: Apportioned costs for Y = 1,227,500 x 1,800,000 = K1,096,530 \n 2,015,000",

    "question": "3 (a) In the context of variance analysis, mention any; \n \n(i) two causes of labour variance. 2 Marks \n \n(ii) three causes of labour efficiency variance. 3 Marks \n \n(b) State five disadvantages of zero based budgeting (ZBB). 5 Marks \n \n(c) Explain the relationship among production budget, material usage budget and \nmaterial purchases budget. 3 Marks \n \n(d) The information below relates to the operations of a manufacturing company in \nthe last one week: \n \n Standard cost per unit: \n K \n Direct materials (10 units at K1.50) 15 \n Direct labour (5 hours at K8 per hour) 40 \n Production overheads (5 hours at K10) 50 \n 105 \n \n Actuals for the week were as follows: \n \n Total direct materials K6,435 \n \n Direct material variances: \n \n Price variance K585 Adverse (A) \n Usage variance K375 Favourable (F) \n \n Required \n \n Calculate the following; \n \n(i) Total direct material cost variance. 1 Mark \n \n(ii) Standard quantity (units). 2 Marks \n \n(iii) Actual material quantity (units). 2 Marks \n \n(iv) Actual material per price unit. 2 Marks \n(TOTAL: 20 MARKS)",
    "answer": "3 (a) (i) Causes of labour rate variance: \n \n(1) Higher or lower rate of labour paid than standard rate. \n(2) Higher or lower grade of workers used than planned. \n(3) Payment of unplanned overtime or bonus. \n \n \n (ii) Causes of labour efficiency: \n \n (1) Use of different grade of labour than planned. \n (2) Poor supervision. \n (3) Machine breakdown. \n \n (b) Disadvantages of zero based budgeting \n \n(i) It is a time consuming process which can generate volumes of \npaperwork. \n \n(ii) There is considerable management skill required in both drawing \ndecision packages and for the ranking process. The skills may not exist \nin the organization. \n\n(iii) It may encourage the wrong impression that all decisions have to be \nmade in the budget. Circumstances change and new opportunities and \nthreats can arise at anytime and organizations must be flexible enough \nto deal rapidly with these circumstances as they occur. \n \n(iv) It may not always be acceptable to staff or management or trade unions \nwho may prefer the cosy status quo and who see the detailed \nexamination of alternatives, costs and benefits as a threat and not a \nchallenge. \n \n(v) Ranking of the decision packages may use subjective judgement \nespecially when there are qualitative rather than quantitative benefits. \n \n(vi) It may emphasize short term benefits at the expense of longer term ones \nwhich in the end may be more important. \n \n \n(c) The production budget is the first of the three budgets to be produced . It is \nusually based on demand (expected sales) and required stock levels at the end \nof the month. The production budget informs (is the input into) the usage \nbudget. The usage budge t indicates the qualities of materials required to be \nproduce the required number of units. The usage budget is an input into the \nmaterials purchases budget. The purchases budget ensures that materials \nrequired as procured and made available when needed for production. \n \n(d) (i) Total direct material cost variance = Price variance + Usage \n = K585 (A) + 375 (F) \n = K210 (A) \n \n (ii) Calculation of standard units \n Direct material cost variance = (Std. units x Std. price)–(Actual units x Actual price) \n 210 (A) = (Std. units x Std. price)–K6,435 \n 210 (A) = (Std. units x K15)–K6,435 \n 6,435–210 = Std. units x 15 \n Standard units = (6,435–210)/15 \n Standard units = 415 units \n \n (iii) Calculation of actual material quantity \n Material usage variance = Std. price per unit material (Std. qty.–Actual qty.) \n K375 (F) = K15 (415 units–Actual quality) \n K375 (F) = 6,225–15xActual quantity \n 15 x Actual quality = 6,225–375 \n Actual quantity = 5,850/15 \n Actual quantity = 390 units \n \n (iv) Calculation of Actual Price of Material per unit \n Total material cost = K6,435 \n Material quantity = 390 units \n Material cost per unit = K6,435/390 \n = K16.50 \n \n\n Alternatively: \n Material cost variance = (Std. units x Std. price)–(Actual units x Actual price) \n 210 (A) = (412xK15)–(390xActual price) \n 210 (A) = 6,225–(390xActual price) \n 390xActual price = 6,225+210 \n Actual price = 6,435/390 \n Actual material price per unit = K16.50",

    "question": "4 (a) (i) A company manufactures three components – A, B and C. The \ncomponent workshop is currently unable to meet the demand for the \ncomponents and is considering ‘buying -in’ from an outside \nmanufacturer. The following data has been obtained: \n \n Components \n A B C \nVariable cost of production per unit (K) 6.00 8.00 14.00 \nBuy-in price per unit (K) 5.00 12.00 26.00 \n \nMachine hours per unit 1 0.5 2 \nLabour hours per unit 2 2 4 \n \nRequired \n \nState which component should be ‘brought -in’ if the company is \noperating at full capacity and give a reason for your decision. 2 Marks \n \n (ii) Calculate which other component should be ‘brought-in’ if: \n \n (1) machine hours are the limiting factor. 5 Marks \n \n (2) labour hours are the limiting factor. 3 Marks \n \n(b) A company manufactures a single product, Sewo. Production operatives are \npaid a basic wage of K30 per hour worked , but an additional 50% premium is \npaid for any overtime hours. The basic working week is 38 hours. \n \n During the month ended 31 March 2023, there were 4 weeks of production and \nthe company employed 30 production operatives. No overtime was worked \nduring the month and all 30 operatives worked for the full 38 hours for each of \nthe 4 weeks of production. During the month, 456 units of Sewo were made. \n \n Required \n \n(i) Calculate the labour cost of a single unit of Sewo made in the month \nended 31 Mark 2023. 4 Marks \n \n(ii) The information below relates to the hours worked by 3 production \noperatives during the month ended 30 April 2023: \n \nSharon: 140 basic hours and 17 hours overtime \nSteve: 150 basic hours and 22 hours overtime \nVerrah: 120 basic hours and 20 hours overtime \n \n Required \n \nCalculate, separately, the total wages earned by each of the operatives; Sharon, \nSteve and Verrah during the month ended 30 April 2023. 6 Marks \n(TOTAL: 20 MARKS)",

    "examinerNote": "Part (a) was on decision making with (i) requiring candidates to state, out of the 3 components, which one should be ‘bought -in’ - in other words, which one should be bought from outside. The question provided information in relation to the table cost of production per unit and buy in price per unit. All that candidates needed to do was to compare these two: you can only buy in this if the cost of buying is lower than the cost of producing the component on your own . This did not require complex calculations. The candidates, calculated ‘contribution’ by subtracting the variable cost of production per unit from the buy -in price per unit. In so doing, they made their recommendation based on the ranking of the ‘contributions’ whereby the component which showed the highest ‘contribution’ was ranked first (number 1) and therefore recommended to be the one to be bought -in. This was totally off-side since such calculations did not result into contribution. That's not how contribution is calculated. In any case, calculation of contribution was not required in this case and there was no information that would have enabled candidates to calculate contribution in the context provided in the question. Part (ii) again required candidates to calculate which other component should be ‘bought-in’ if either machine hours or labor hours were a limiting factor. There was a lot of confusion. First, the issue of calculating ‘contribution’ as done in part (i), continued here. As indicated earlier, this was wrong. Secondly, candidates again considered all the three components so as to come up with the other component to be bought -in. The question had clearly indicated that th e candidates were to calculate which other component to buy in. By saying “ other component ”, it means that the consideration about the component to be bought -in was supposed to exclude the one which had already been identified in part (i). It means the choice was to be between the remaining two. Candidates missed the key word “other” in the question and therefore recommended product A for all scenarios of the limiting factors . Thirdly, candidates failed to calculate the additional cost per limiting factor. In this particular case, the other component to be bought -in would be the one which had a lower additional cost per limiting factor. This could only be calculated by first of all calculating the additional cost per unit , then dividing it by the hours per unit, in which case the additional cost per unit is the difference between the buy-in price and production variable cost per unit . Fourthly, while others managed to calculate the additional cost per unit, being the difference between th e buy- in cost per unit and the variable production cost per unit, they stopped there and made a decision based on those differences only. Surely that was incomplete and they could not gain all the marks allocated to the question. Part (b) was on calculation of labor cost per unit of the product and wages per employee. The labour cost per unit was not much of a problem to most candidates much as some candidates left out some of the elements in the calculation thereby getting the result wrong. On the calculation of wages per employee, some candidates failed to factor in the overtime in the total wages while others calculated the overtime only leaving out the pay for the regular (normal) time. Total wages in this particular case were supposed to be a sum of the wages based on the normal time and the overtime. Some missed the calculation by multiplying the basic wage of K30.00 per hour by 50% instead of 150% to markup the overtime premium while others used 150% to calculate overtime only, then added wages for normal time . This was double counting as the 150% already includes the normal wage rate.",

    "question": "5 (a) Explain how budgets are used to fulfil each of the following purposes: \n \n(i) Control 2 Marks \n(ii) Motivation 2 Marks \n(iii) Performance evaluation 2 Marks \n(iv) Planning 2 Marks \n(v) Coordination of activities 2 Marks \n \n(b) Explain how standards fulfil the role of management by exception (MBE). \n2 Marks \n \n(c) Explain the impact of each of the following inventory valuation methods on the \nvalues of inventory at the end of a period. \n \n(i) Last in first out (LIFO). 2 Marks \n(ii) First in first out (FIFO). 2 Marks \n(iii) Marginal cost. 2 Marks \n(iv) Absorption costing. 2 Marks \n(TOTAL: 20 MARKS) \n \n \n \n \n \nEND",
    "answer": "5 (a) How budgets are used to fulfil each of the following: \n \n(i) Control – by comparing actual costs and revenues against those \nbudgeted to determine the variance which makes management operate a \nsystem of management by exception by concentrating on investigating \nsignificant deviations from the original budget. \n \n(ii) Motivation – budgets provide a standard which managers strive to \nachieve by providing them with a challenge (targets). Rewards are at \ntimes linked to achievement of targets in the budgets. \n \n(iii) Performance evaluation – managers’ performance is assessed by their \nability to meet the budgets at the end of the reporting period. \n \n(iv) Planning – budgets encourage managers to plan for future operations \nand consider how conditions in the next year might change and what \nsteps to take now in order to respond to these changed conditions. \n2 Marks \n \n(v) Coordinating activities – budgets bring together activities from different \ndepartments and reconciles them into a common plan. This ensures that \nthe activities in the organization speak to each other (synchronized) to \nachieve a common goal. \n \n(b) Variance analysis identifies which actuals were different from those planned. If \nan actual matches the expected (standard), then the re is no need to investigate \nit. Only actuals causing large variances are worthy of investig ation, so \nmanagement can focus its attention on a small number of items each \nmonth/period. \n \n(c) Impact of inventory valuation methods on the value of inventory: \n \n(i) Last in first out (LIFO) – assumes that the most recent inventory items \nto be brought in are the first to be taken out. This leaves the inventory \nthat was purchased a long time ago in stock. With the passage of time, \nthe old stock is valued at a low cost as the cost at which it was purchased \nmight have been overtaken by inflation. As a result, the value of \ninventory using LIFO is low (understated). \n \n\n(ii) First in first out (FIFO) – assumes that the most recent inventory items \nto be brought in are the last to be taken out while those purchased first \nare also the first to be taken out. This leaves the inventory that was \npurchased most recently in stock. As a result, the value of the remaining \ninventory almost reflects the ruling market price of the inventory. As a \nresult, the inventory is deemed fairly valued. \n \n(iii) Marginal costing – excludes fixed costs in the cost of inventory as these \nare written off as period costs and uses variable costs only. As a result, \nthe value of the inventory at the end of the period is low. \n \n(iv) Absorption costing – captures both fixed and variable costs as part of the \ninventory costs. As a result, the value of the inventory is high at the end of the \nperiod with the inclusion of the fixed costs. This means the fixed costs are \ncarried forward to the next period in the value of inventory at the end of the \nperiod.",

    "answer": "2 (a) (i) ABC uses cost pools while absorption costing uses cost centres. As a \n result, in ABC costs are allocated and apportioned to more ‘cost centres’ \n then is the case in absorption costing. 1 Mark \n \n(ii) In ABC, cost drivers are used to calculate the absorption rates. Cost \ndrivers are activities that cause or influence the cost. In absorption \ncosting, various ba ses applied to the whole cost centre are used to \ndetermine the absorption rate. As such, a single cost centre in absorption \ncosting can have several cost drivers in ABC. 1 Mark \n \n(iii) In absorption costing, idle capacity costs are charged to the products \neven though they in no way enhance the value of the product, while this \nis not the case in ABC. 1 Mark \n \n (b) (i) Marginal costing does not include fixed costs in the value of inventory \nas these are written off as period costs. B y excluding fixed costs, the \nvalue of inventory is understated. 2 Marks \n \n(ii) In using last in first out (LIFO), the closing inventory is valued at the \noldest cost of inventory which might have been overtaken by inflation. \nAs such, the costs are lower than what is obtaining on the market \ncurrently leading to an understatement of inventory. 2 Marks \n \n \n \n \n \n\n (c) Definitions \n \n(i) EOQ is the amount of inventory to be ordered at one time for purposes \nof minimizing annual inventory cost while maintaining inventory levels \nat desirable levels. 1 Mark \n \n(ii) Reorder level is the level to which inventory is to be allowed to fall \nbefore an order for further supplies is placed. 1 Mark \n \n(iii) Maximum level is the highest quantity of inventory which must not be \nexceeded. 1 Mark \n \n(iv) Lead time is the time taken from placing an order for inventory to the \nreceipt of the inventory. 1 Mark \n \n(v) Minimum level is the lowest level to which the inventory should be \nallowed to fall before replenishment or placing an order. 1 Mark \n \n(d) (i) Re-order level = Maximum usage x Maximum re-order period \n = 2,200 x 60 \n = 132,000 units 2 Marks \n \n (ii) Minimum stock level = Re-order level – (average usage x average \n Re-order period) \n = 132,000 – (1,020 x 55) \n = 75,900 units 2 Marks \n \n (iii) Maximum stock level = Re-order level + re-order quantity – (minimum \n Usage x minimum re-order period) \n = 132,000 + 30,060 – (240 x 50) \n = 150,060 units 2 Marks \n \n (iv) Average stock = (Maximum stock level + minimum stock level) \n 2 \n = (150,060 + 75,900) \n 2 \n = 112,980 units 2 Marks \n(TOTAL: 20 MARKS)",

ing WIP 4,400 19,800 \nOverheads 41,160 Normal loss 750 - \nAbnormal gain 150@8.50 1,275 \n 15,150 104,800 15,150 104,800 \n 5 Marks \n (TOTAL: 20 MARKS) \n \n \n\n Workings \n \n Value of finished Output = 10,000 x K8.50 \n = K85,000 \n \nThe value of the closing WIP can be found either by deducting the value of \ncompleted finished output from total costs or, more tediously, by calculating the \nvarious element values, as follows: \n \nValue of closing WIP = Total costs – Value of finished output \n = 104,800 – 85,000 \n = K19,800 \nOR \n \nMaterials 3,520 x K2.00 = K 7,040 \nLabour 2,200 x K3.00 = K 6,600 \nOverhead 1,760 x K3.50 = K 6,160 \n K19,800 \n Abnormal Gain \n \n = 150 x K8.50 \n = K1,275",

hallenges in valuing the abnormal gain while others had problems with the double entry - debiting the account with items that should have been credited and vice versa. Some candidates ended up finding a value for the normal loss yet the question did not provide information about the scrap value of the normal loss . Candidates are reminded t hat abnormal gain is valued at the same unit cost as the completed units while normal loss has no value unless specifically told that there is a scrap value for the same.",

    "answer": "5 (a) (i) Cost allocation is the charging of discrete, identifiable items of cost to \n cost centres. It ensures that costs are directly charged to cost centres \nwhich incurred them. 2 Marks \n \n(ii) Cost apportionment is the proportional allotment of cost to cost centres \nbased on proxies. It ensures that there is a “fair” share of common costs \namong cost centres despite the bases being more or less arbitrary. \n 2 Marks \n \n\n(iii) Cost absorption is the distribution of costs into final products. It ensures \nthat all costs pertaining to a cost centre are taken into account when \nsetting the selling price of the product to ensure recovery of such costs \nthrough the selling price. 2 Marks \n \n(b) (i) Absorption costing is advantageous in the sense that it is relevant for \n external reporting in the context of inventory valuation for the purposes \nof financial statements as it is recommended for use by the International \nFinancial Reporting Standards (IFRS) 2: Inventory. 2 Marks \n \n(ii) Cost behaviour is associated with learning how costs change when there \nis a change in an organization’s level of activity. Understanding cost \nbehaviour helps a company to make decisions associated with different \nlevels of activity and how the costs should be treated. 2 Marks \n \n(c) (i) In a make or buy decision, marginal costs will be necessary in\n identifying the difference in costs between making a product in-house \n or buying the product from outside by establishing additional costs the \n company will incur in making the product in-house. 2 Marks \n \n(ii) In deciding whether to further process a product or not, marginal costs \nwill be used in comparing the a dditional revenues which further \nprocessing can bring and the extra costs which will be incurred in further \nprocessing. A decision to further process will be taken if the additional \nrevenues are higher than the extra costs to be incurred in further \nprocessing. 2 Marks \n \n (d) (i) Margin of safety indicates the amount by which a company’s sales could \n decrease before the company starts making a loss. Its importance lies in \n its ability to guide the organization in deciding the volume of sales to \nmake to achieve a particular profit target. 2 Marks \n \n(ii) Break-even point is a level where the company neither makes profit nor \nloss (revenues are the as same costs). Its significance is that it helps a \ncompany to know the impact of either the sales volumes or costs on the \ncompany’s ability to make a profit. The company can make decisions \non whether to reduce costs or increase selling prices to break even at \nlower sales volumes. 2 Marks \n \n(iii) A limiting factor affects the level of activity of a company. Its \nsignificance lies in its ability to help the organization in deciding the \nbest use of how the limited resource can be put to e.g. maximization of \nprofit. 2 Marks \n(TOTAL: 20 MARKS)",

    "answer": "4 (a) A job costing system relates to a costing system where each unit or batch of \n output of products or service is unique. This cre ates the need for cost of each \n unit or batch to be calculated separately. In contras t, a process costing system \n relates to situations where masses of identical units or batches are produced, \n thus making it unnecessary to as sign costs to individual units or batches of \n output. Instead, the average cost per unit or batch of output is calculated by \n dividing the total costs assigned to a product or service for the period by the \n number of units or batches of output for the period. 3 Marks \n \n (b) (i) Retention monies relate to part of contract price for the work done and \n certified which is kept by the client. It ensures that the contractor is paid \nonly after the contract has been completed and any defects relating to \nthe contract are rectified so that the client does not spend more by \nengaging another contractor to rectify the defects. 2 Marks \n \n(ii) Architect’s certificates show the amount of work done by a contractor \nin relation to the whole contract. They are a basis for the contractor to \ninvoice the client for payment against the w ork done so far, otherwise \nthe contractor may not be paid anything for the work done. 2 Marks \n \n(c) The key difference is that the total revenue functions are curvilinear in the \neconomist’s model whereas the accountant’s model assumes linear \nrelationships. However, the accountant’s model is intended to predict CVP \nbehaviour only within the relevant range, where a firm is likely to be operating \non constant returns to scale. Otherwise, a comparison of the two models \nsuggests that within the relevant range of activity, the total costs and revenue \nfunctions are fairly the same. 3 Marks \n \n(d) (i) Shortfall of Material A \n \n Required materials (kg) for Material A: Kg \n Product W (K10,000/K4) = 2,500 \n Product X (K12,000/K4) = 3,000 \n Pr     "answer": "5 (a) Uses of cost information: \n \n(i) Cost information is used to determine the cost of goods sold and \ninventories for internal and external profit reporting and inventory \nvaluation. 2 Marks \n \n(ii) It is used to provide relevant information which can assist the \norganisation in making decisions. 2 Marks \n \n(iii) It is used to provide information for planning, control and performance \nmeasurement. 2 Marks \n \n(b) The use of actual overhead rates causes a delay in the calculation of product or \nservice costs, and the use of monthly rates causes fluctuations in the overhead \nrates throughout the year. It is in this vein that annual budgeted overhead rates \nshould be used to ensure timely determination of product or service costs. \n2 Marks \n \n(c) (i) In the short term, some costs and revenues may not be relevant for \n decision making because they usua lly remain unchanged for all \n alternatives under consideration in the short term. Changes may happen \n over the long term. 2 Marks \n \n \n \n\n(ii) This is a misconception because not all fixed costs are irrelevant for \ndecision making. Fixed costs are relevant for decision making when \nthey differ between or among alternatives (attributable fixed costs). \nOtherwise, this is true only to the extent that fixed costs remain the same \nbetween or among the alternatives under consideration. 2 Marks \n \n(iii) Book values of equipment relate to past costs –costs that were already \nincurred. For purposes of making a decision as to whether to replace the \nequipment or not, past costs are not relevant for that decision as they are \nsunk costs. 2 Marks \n \n(d) (i) By applying to short term horizon only, it means it cannot be used for \n long term decisions. Companies do not make short term decisions only. \n Planning ordinarily goes beyond a 12 -month period, meaning that \n decision-making goes beyond that period as well – for which CVP \n analysis cannot be used. 2 Marks \n \n(ii) By being applicable to one product only or a constant sales mix, the \nanalysis cannot be used for companies with a diversity of products in the \nformer, while in the latter, there are some market and the other \nenvironmental dynamics which may make it practic ally not possible to \nhave a constant sales mix as some of the factors affecting this may be \nbeyond the control of the company. For example, the demand for some \nproducts may be affected by seasons – experiencing high demand in \nsome months and low in others. 2 Marks \n \n(iv) By using variable costing only, the analysis is not applicable in \nsituations where the company uses absorption costing and it therefore \nforegoes the advantages that are associated with absorption costing \nsystem. Alternatively, by using absorption costing, it implies that all \ncosts have to be accurately separated into fixed and variable costs, yet \nsome costs may be mixed and the separation of the fixed and variable \nelements may only be arbitrary. 2 Marks \n(TOTAL: 20 MARKS)",

    "question": "1 (a) In the context of process costing, explain \n \n(i) the costing treatment of “normal loss”. 1 Mark \n(ii) the four costing treatments of by-products. 4 Marks \n \n(b) State any four assumptions behind the economic order quantity (EOQ) in the \ncontext of inventory control. 4 Marks \n \n(c) A company produces an industrial chemical at its factory. At the beginning of \nthe year, the factory had the following standard cost card: \n \n K \n Direct materials (10kg @ K16.00/kg) 160.00 \n Direct labour (0.75hr @ K180.00/hr) 135.00 \n Variable overhead (0.75hr @ K30.00/hr) 22.50 \n Fixed overhead (0.75hr @ K40.00/hr) 30.00 \n Standard cost per unit 347.50 \n \nThe company calculates its overhead rates using practical capacity which is \n7,200 units. The actual results for the year are as follows: \n \n(i) 7,000 units were produced. \n(ii) 74,400 kg of direct materials were purchased at K15.00 per kg. \n(iii) 73,600 kg of direct materials were used. \n(iv) 5,600 hours of direct labour were worked at a rate of K179.00 per hour. \n(v) Variable overhead amounted to K175,400. \n(vi) Fixed overhead amounting to K214,000 was incurred. \n \n Required \n \n Calculated the following variances: \n \n(i) Total material price variance. 1 Mark \n(ii) Direct material usage variance. 2 Marks \n(iii) Direct labour rate variance. 1 Mark \n(iv) Direct labour efficiency variance. 2 Marks \n(v) Variable overhead expenditure variance. 1 Mark \n(vi) Variable overhead efficiency variance. 1 Mark \n(vii) Fixed overhead expenditure variance. 1 Mark \n(viii) Fixed overhead volume variance. 2 Marks \n (TOTAL: 20 MARKS)",
    "answer": "1 (a) (i) Since normal loss is expected, it is not given a cost except where the \n normal loss has a scrap value in which case the scrap value is deducted \n from the cost of materials. 1 Mark \n \n(ii) Since the by-product has a commercial value, the income earned from \nthe sale of the by-product can be recognized in different ways as \nfollows: \n \n (1) It may be added to the sales from the main product. 1 Mark \n (2) It may be treated as a separate incidental source of income. \n1 Mark \n(3) It may be deducted from the production cost of sales of the main \nproduct. 1 Mark \n \n(4) Deducting the net realizable value of the by -product from the \nproduction cost of the main product. 1 Mark \n \n (b) Assumption behind the economic order quantity: \n(i) There is a known constant stock holding cost. \n(ii) There is a known constant ordering cost. \n(iii) The rates of demand are known. \n(iv) There is a known constant price per unit. \n(v) The replenishment is made instantaneously i.e. the whole batch is \ndelivered at once \n Any four, 1 mark each = 4 Marks \n \n(c) \n(i) Material price variance = K(16-15)x74,400 \n = K74,400 F 1 Mark \n \n(ii) Material usage variance \n \n 7,000 units should have used (7,000 x 10kg) = 70,000 kg \n Actual quantity used 73,600kg \n Variance 3,600kg \n Standard price per kg \n \n \n(iii) Direct labour rate variance = K(180-179) \n = K5,600 \n K16 \n K57,600 \n 2 Marks \n \nx 5,600 hours \nFavourable 1 Mark \n \n(iv) Direct labour efficiency variance \n \n \n 7,000 units should have taken (7,000 x 0.75hr) = 5,250 hours \n Actual time taken = 5,600 hours \n 350 hours \n\n Standard price per hour K180.00 \n K63,000 \n 2 Marks \n(v) Variable overhead expenditure variance \n 5,600 hours should have cost (5,600 X K30 = K168,000 \n But did cost K175,400 \n K7,400 1 Mark \n \n(vi) Variable overhead efficiency variance = (5,250 hours – 5,600 hours) x K30 \n = K10,500 1 Mark \n \n(vii) Fixed overhead expenditure variance \n Budgeted overhead expenditure (7,200 x K30) K216,000 \n Actual overhead incurred K214,000 \n K2,000 Favourable 1 Mark \n \n(viii) Fixed overhead volume variance \n Budgeted volume 7,200 units \n Actual volume 7,000 units \n 200 units \n Standard overhead rate K30 \n K6,000 \n 2 Marks \n (TOTAL: 20 MARKS)",

    "question": "2 (a) (i) State the two types of variances under the total material price variance. \n2 Marks \n \n(ii) Explain the difference between continuous stocktaking and perpetual \ninventory. 3 Marks \n \n(b) A company produces three products: X, Y and Z, in a single process. There is \na 10% normal loss of input in the process. The products emerge in the ratio of \n5:3:2 respectively. \n \n The following are the budgeted figure for the month of November 2024: \n \n Material input 80,000 kg @ K2 per kg \n Labour 3,000 hours @ K6 per hour \n Variable overhead 3,000 hours @ K3 per hour \n \n Fixed overhead is absorbed at 50% of labour cost, \n \nThe normal loss is sold for scrap value at K1 per kg and proceeds are credited \nto the process account. \n \n There will be no opening or closing work-in-progress. \n \n The products sell for: X K15 per kg \n Y K12 per kg \n Z K10 per kg \n \n Required \n \n(i) Calculate the joint process costs. 2 Marks \n \n(ii) Using the sales value method, A pportion the joint process costs to the \nthree products. 3 Marks \n \n(c) Products X, Y and Z in (b) above can further be processed into products P, Q \nand R respectively and the selling prices would be: \n \n P: K18 per kg \n Q: K15 per kg \n R: K12 per kg \n \nThis further processing would cost K1 per kg of input with a 10% normal \nmaterial loss of the input with no scrap value. \n \nRequired \n \nAdvise the company as to which, if any, of the products X, Y and Z should be \nprocessed further. 10 Marks \n(TOTAL: 20 MARKS)",

    "question": "3 (a) Explain the importance of setting up each of the following in the context of \n inventory control: \n \n(i) Re-order level 2 Marks \n(ii) Re-order quantity 2 Marks \n(iii) Minimum quantity 2 Marks \n(iv) Lead time 2 Marks \n \n(b) Explain \n \n(i) the significance of marginal costs in the decision making process. \n2 Marks \n \n(ii) any three limitations of breakeven analysis as a decision making tool. \n3 Marks \n \n(c) A differential piecework scheme has a basic rate of K5,000 per unit. Output in \naddition to 500 units is paid at higher rates. The premiums over and above the \nbasic rate, which apply only to additional units over the previous threshold, are: \n \n Output (units) Premium (per unit) \n 501-600 K500 \n Above 600 K1,000 \n \n Required \n \n Calculate the total cost of labour if output is 620 units. 5 Marks \n \n(d) Overheads in a company are absorbed at a pre -determined rate based on direct \nlabour hours. The following additional information is available for a period. \n \n Budget K164,000 overhead expenditure 10,000 direct labour hours \n Actual K158,000 overhead expenditure 9,800 direct labour hours \n \n Required \n \n Calculated the amount of overhead that was over/under-absorbed in the period. \n 2 Marks \n (TOTAL: 20 MARKS)",
    "answer": "3 (a) (i) Re-order level is the quantity of stock at which an order will be placed \nfor additional supplies of stocks material so that delivery will be made \nbefore the business runs out of stock. It helps to avoid stock outs by \nensuring that additional stocks are ordered and delivered in time in line \nwith the lead. 2 Marks \n \n(ii) Re-order quantity is the optimum quantity that should be ordered each \ntime an order is being placed. This is important as it ensures that the \nright quantity of stocks are ordered in line with usage since high \nquantities might lead to tying up capital in stoc ks and over -stocking \nwhich might lead to some stocks becoming obsolete. 2 Marks \n \n(iii) Minimum level is the level of inventory below which inventory should \nnot be allowed to fall. It is important to have this since in case of any \nitem of inventory falling below this level, there is danger of disrupting \nproduction due to stock outs. 2 Marks \n \n \n \n\n(iv) Lead time is the amount of time between placing an order and receiving \nthe inventory ordered. It helps planning and scheduling production to \nensure that production is not disrupted and the customers’ orders timely \nmet thereby ensuring customer satisfaction. It also helps in ensuring that \nthere are no stockouts before delivery of the ordered materials in line \nwith usage. 2 Marks \n \n (b) (i) Marginal cost are incremental future costs. As such they are used in \nmaking decisions which are forward looking in nature. 2 Marks \n \n (ii) Limitations of breakeven analysis \n \n• It applies to a single product or a single product mix only. This restricts \nits usefulness to those firms which may be producing more than one \nproduct or product mix. \n \n• It assumes that fixed costs are the same in total and variable costs are \nthe same per unit at all levels of output. This assumption is a real \nsimplification when it comes to real life. \n \n• It assumes that the sales price will be constant at all levels of activity. \nThis may not be true, especially at higher volumes of output, where the \nprice may have to be reduced to win extra sales. \n \n• Production and sales are assumed to be the same. Therefore, the \nconsequences of any increase in stock (when production volumes \nexceed sales) or ‘de -stocking’ (when sale volumes exceed production \nlevels) are ignored. \n \n• Uncertainty in the estimates of fixed cost and unit variable costs is often \nignored in breakeven analysis and some costs, e,g. mixed costs and step \ncosts, are not always easily categorized or divided into fixed and \nvariable. \nAny three, 1 mark each = 3 Marks \n \n (c) K \n 620 units @ K5,000 = 3,100,000 \n 100 units @ K500 = 50,000 \n 20 units @ K1,000 = 20,000 \n 3,170,000 \n 5 Marks \n (d) \nExpected overhead absorbed [(164,000/10,000 hrs)x9,800 hrs] = K160,720 \nActual overhead absorbed = K158,000 \nOverhead over-absorbed = K2,720 \n 2 Marks \n (TOTAL: 20 MARKS)",

    "question": "4 (a) Define each of the following types of standards: \n \n(i) Basic standards 1 Mark \n(ii) Ideal standards 1 Mark \n(iii) Attainable standards 1 Mark \n(iv) Current standards 1 Mark \n \n(b) Explain any two uses of standards in the context of standard costing. 4 Marks \n (c) A firm has produced the following budgets for two activity levels: \n \n Expense Budget for 5,000 units Budget for 6,000 units \n K K \n Wages (semi-fixed) 16,000 17,200 \n Materials (variable) 25,000 30,000 \n Required \n Calculate the following using the budget above: \n \n(i) Wages variable cost per unit. 1 Mark \n(ii) Wages fixed cost. 1 Mark \n(iii) Total wages at activity level of 6,200 units. 1 Mark \n(iv) Material cost per unit. 1 Mark \n \n(d) A company with a financial year ending 31 October, is undertaking a \nconstruction contract priced at K12,000,000 which will be complete d in June \n2025. The following expenses were incurred on the contract for the year ended \n31 October 2024: \n \n K’000 \n Materials 2,140 \n Wages 3,328 \n Plant 3,040 \n Hire of concrete mixer 800 \n \n Cash received on account of the contract to 31 October 2024 was K4,800,000, \nbeing 80% of the value of the work certified while the value of materials in hand \nwas K920,000. The plant depreciated by 20% in the year. The contract will \nrequire K3,300,000 more to be completed. Work done worth K820,000 had not \nyet been certified as at 31 October 2024. \n \n Required \n \n(i) Prepare Contract Account. 5 Marks \n \n(ii) Calculate the amount of profit, if any, to be recognized on the contract \nfor the year ended 31 October 2024. 3 Marks \n (TOTAL: 20 MARKS)",
    "answer": "4 (a) (i) Basic standards are long term standards which remain unchanged over \n a long period of time. 1 Mark \n \n(ii) Ideal standards are standards which can only be achieved under the most \nfavourable working conditions (such as no machine breakdowns, no idle \ntime, no wastage etc). 1 Mark \n \n(iii) Attainable standards are standards which can be attained if a standard \nunit of work is carried out efficiently, a machine properly operated or \nmaterial properly used and allow for normal losses and machine \nbreakdowns. 1 Mark \n \n(iv) Current standards are standards set for use over a short period to reflect \ncurrent changed conditions. 1 Mark \n \n (b) Uses of standards: \n \n(i) Efficiency measurement \n \nThe comparison of actual costs with standard costs enables the \nmanagement to evaluate perform ance of various cost centres. In the \nabsence of standard costing system, actual cost of different period may \nbe compared to measure efficiency. It is not proper to compare costs of \ndifferent period because circumstance of both the periods may be \ndifferent. Still, a decision about base period can be made with which \nactual performance can be compared. \n \n(ii) Finding variances \n \nThe performance variances are determined by comparing actual costs \nwith standard costs. Management is able to spot out the place of \ninefficiencies. It can assign responsibility for deviation in performance. \nIt is possible to take corrective measures at the earliest. \n \n(iii) Management by exception \n \nThe targets of different individuals are fixed if the performance is \naccording to predetermined standards. The attention of management is \ndrawn only when actual performance is outside the standard. \n \n(iv) Cost control \n \nEvery costing system aims at cost control and cost reduction. The \nstandards are being constantly analysed and an effort is made to improve \nefficiency. Whenever a variance occurs, the reasons are studied and \nimmediate corrective measures are undertaken. The action taken in \nspotting weak points enables cost control system. \n \n \n \n\n(v) Eliminating inefficiencies \n \nThe setting of standards for different elements of cost requires a detailed \nstudy of different aspects. The standards are set differently for \nmanufacturing, administrative and selling expenses. Improved methods \nare used for setting these standards. The determination of \nmanufacturing expenses will require time and motion study for labour \nand effective material control devices for materials. Similar studies will \nbe needed for finding other expenses. All these studies will make it \npossible to eliminate in effeciencies at different steps. \nAny two, 2 marks each = 4 Marks \n \n (c) (i) Wages variable cost per unit = K(17,200-16,000)/(6,000-5,000) \n = K1.20 1 Mark \n \n (ii) Wages fixed cost = K16,000-(5,000x1.2) \n = K10,000 1 Mark \n \n Alternatively: \n = K17,200-(6,000x1.2) \n = K10,000 \n \n (iii) Wages at 6,200 units = K10,000+(6,200Xk1.2) \n = K17,440 1 Mark \n \n (iv) Material cost per unit = K(25,000/5,000) \n = K5 1 Mark \n \nOr K30,000/6,000 \n = K5 \n \n (d) (i) Contract account \n \n K’000 \n Materials 2,140 \n Wages 3,328 \n Plant 3,040 \n Hire of concrete mixer 800 \n 9,308 \n \n K’000 \n Materials c/d 920 \n Plant (3,040*80%) 2,432 \n Cost of work not certified 820 \n Cost of work certified (bal. fig) 5,136 \n 9,308 \n 5 Marks \n \n (ii) Attributable profit \n K’000 K’000 \n Contract price 12,000 \n Less: total contract costs \n Cost of work certified 5,136 \n Cost of work not certified 820 \n Cost to completion 3,300 9,256 \n Estimated total profit 2,744 \n 1 Mark \n\n Attributable profit: = Value of work certified x estimated total profit \n Contract price \n \n = (100/80 x 4,800,000) \n \n = 6,000,000 x 2,744,000 \n 12,000,000 \n \n = K1,372,000 2 Marks \n (TOTAL: 20 MARKS)",

    "question": "5 (a) Explain any four advantages of absorption costing. 4 Marks \n \n (b) Explain the impact of absorption costing on each of the following: \n \n(i) Inventory valuation 2 Marks \n(ii) Product pricing 2 Marks \n(iii) Profit measurement 2 Marks \n \n(c) Explain the relevance of the following in decision making: \n \n(i) Attributable fixed costs 2 Marks \n(ii) Understanding of cost behaviour 2 Marks \n(iii) Margin of safety 2 Marks \n(iv) Break-even point 2 Marks \n(v) Limiting factor 2 Marks \n(TOTAL: 20 MARKS) \n \n \nEND",
    "answer": "5 (a) Advantages of absorption costing are as follows: \n \n(i) Fixed costs are a substantial and increasing proportion of costs in \nmodern industry. Production cannot be achieved without incurring fixed \ncosts which thus form an inescapable part of the cost of production. As \nsuch, they should be included in stock valuations. \n \n(ii) Where production is constant but sales fluctuate, net profit fluctuations \nare less with absorption costing than with marginal costing. \n \n(iii) Where stock building is a necessary part of operations, the inclusion of \nfixed costs in stock valuation is necessary and desirable: otherwise a \nseries of fictitious losses will be shown in earlier periods to be offset \neventually by excessive profits when the goods are sold. \n \n(iv) The inclusion of fixed costs in production costs enables proper and \ncorrect pricing decisions to be made – price which recovers all costs. \n \n(v) Accounting standard on stock valuation recommends the use of \nabsorption costing for financial accounts because costs and revenues \nmust be matched in the period when the revenue arises not when the \ncosts are incurred. It also recommends that stock valuations must \ninclude production overhead incurred in the normal course of business \neven if such overheads are fixed. \nAny four, 1 mark each = 4 Marks \n \n(b) (i) Inventory valuation \n \nAll costs incurred in the conversion process are included in the product \ncost – meaning that all indirect costs are attributed to cost units thereby \nincreasing the cost of inventory. 2 Marks \n \n (ii) Pricing \n \nWhere the total product is used as the basis for pricing as cost recovery \nbasis, the selling price is established by adding a profit mark up to the \ntotal cost. This means the selling price set ensures recovery of all costs \n– hence is usually high. 2 Marks \n \n\n (iii) Profitable measurement \n \nProfit is calculated after taking out overheads recovered through closing \ninventory. Since the closing inventory includes some fixed costs, the \nsubtraction of closing inventory leads to lower profit. 2 Marks \n \n(c) (i) Attributable fixed cost are relevant because they are incremental costs \nassociated with a particul ar decision and therefore vary between \ndifferent decisions. 2 Marks \n \n(ii) Cost behaviour is associated with learning how costs change when there \nis a change in an organisation’s level of activity. Understanding cost \nbehaviour helps a company to make decisions associated with different \nlevels of activity and how the costs should be treated. 2 Marks \n \n(iii) Margin of safety indicates the amount by which a company’s sales could \ndecrease before the company starts making a loss. Its importance lies in \nits ability to guide the organisation in deciding the volume of sales to \nmake to achieve a particular profit target. 2 Marks \n \n(iv) Break-even point is a level where the company neither makes profit nor \nloss (revenues are the same as costs). Its significance is that it helps a \ncompany to know the impact of the either sales volumes or costs on the \ncompany’s ability to make profit. The company is able to make decision \non whether to reduce costs or increase selling prices so as to break-even \nat lower sales volumes. 2 Marks \n \n(vi) A limiting factor affects the level of activity of a company. Its \nsignificance lies in its ability to help the organisation in deciding the best \nuse the limited resource can be put on e.g. maximisation of profit. \n2 Marks \n(TOTAL: 20 MARKS)",

    "answer": "2 (a) (i) The production budget is the first of the three budgets to be produced. \nIt is usually based on demand (expected sales) and required stock levels \nat the end of the month. The production budget informs (is the input \ninto) the usage budget. The usage budget indicates the quantities of \nmaterials required to produce the required number of units. The usage \nbudget is an input into the materials purchas es budget. The material \npurchases budget ensures that the materials required are procured and \nmade available when needed for production. 3 Marks \n \n(ii) Basic standards remain unchanged over a long period of time. They tend \nto be overtaken by circumstances (such as inflation, technology e.t.c.) as \ntime goes. As a result, they don’t reflect the actual conditions under \nwhich operations were done when compared to the time the sta ndards \nwere first set. They are therefore too outdated to be used for \nperformance measurement in the long run. 2 Marks \n \n (b) Disadvantages of zero based budgeting \n \n(i) It is a time consuming process which can generate volumes of paper \nwork. \n \n(ii) There is considerable management skill required both in drawing \ndecision packages and in carrying out the ranking process. These skills \nmay not currently exist in the organisation. \n \n(iii) It may encourage the wrong impression that all decisions have to be \nmade in the budget. Circumstances change and new opportunities and \n\nthreats can arise at any time and organisations must be flexible enough \nto deal rapidly with these circumstances as they occur. \n(iv) It may not always be acceptable to staff or management or trade unions \nwho may prefer the cosy status quo and who see the detailed \nexamination of alternatives, costs and benefits as a threat and not a \nchallenge. \n \n(v) Ranking of decision packages may use subjective judgements especially \nwhen there are qualitative rather than quantitative benefits. \n \n(vi) It may emphasize short term benefits at the expense of longer term ones \nwhich in the end may be more important. \nAny five, 1 mark each = 5 Marks \n \n (c) (i) Sales budget = 200,000 x K30 \n = K6,000,000 1 Mark \n \n (ii) Production Budget \n Units to be sold 200,000 \n Add planned closing stock 10,000 \n 210,000 \n Less planned opening stock (40,000) \n Units to be produced 170,000 \n 2 Marks \n \n (iii) Material Usage Budget \n \n Material M = 170,000 x 20 \n = 3,400,000 kg \n \n Material N = 170,000 x 30 \n = 5,100,000 kg 2 Marks \n \n (iv) Material Purchase Budget \n \n Material M Material N \nQuantity required to meet production 3,400,000 5,100,000 \nAdd: planned closing stock 2,000 1,000 \n 3,402,000 5,101,000 \nLess: planned opening stock (10,000) (8,000) \n 3,392,000 5,093,000 \nAdd: provision for loss 500 300 \n 3,392,500 5,093,300 \nCost per kilo K5 K4 \nTotal Purchase K16,962,500 K20,373,200 \n 5 Marks \n (TOTAL: 20 MARKS)",

    "answer": "4 (a) Impact of inventory valuation methods on the value of inventory: \n \n(i) The replacement cost method of stock valuation values the exi sting \ninventory at the cost of the new inventory, i.e. it uses the ruling market \nprices of the inventory. Since the market price of the inventory is \nusually higher than the cost at which the inventory was initially \npurchased, the value of the closing inventory is high. 2 Marks \n \n(ii) First in first out (FIFO) assumes that the most recent inventory items to \nbe brought in are the last to be taken out while those purchased first are \nalso the first to be taken out. This leaves the inventory that was \npurchased most recently in stock. The value of the remaining inventory \ntherefore almost reflects the ruling market price of the inventory. As a \nresult, the inventory is deemed fairly valued. 2 Marks \n \n(iii) Absorption costing captures both fixed and variable costs as part of the \ninventory costs. This means the fixed costs are carried forward to the \nnext period in the value of inventory at the end of the period. As a result, \nthe value of the inventory is hig h at the end of the period with the \ninclusion of the fixed costs. 2 Marks \n \n(b) The high-low method is used to separate between fixed and variable costs in a \nmixed cost. The method is important in marginal costing since in marginal \ncosting, fixed costs and valuable costs are treated differently and are therefore \nsupposed to be separated accordingly. 2 Marks \n \n(c) A blanket overhead rate establishes a single overhead rate for the organisation \nas a whole whereas departmental rates involve indirect costs being accumulated \nby different departments and separate overhead rates being established for each \ndepartment. A bl anket overhead rate can only be justified when all products \nand services consume departmental overheads in approximately the same \nproportions. Such circumstances a re unlikely to be applicable to most \norganisations resulting in blanket overheads genera lly reporting inaccurate \nproduct/service. 3 Marks \n \n(d) (i) Process Account \n Kg K \nMaterial (20000X5) 20,000 100,000 \nLabour (16000X6.75) 100,000 \nOverhead (16000X3) 48,000 \nAbnormal Gain 800 10,560 \n 20,800 258,560 \n Kg K \nNormal loss 1,000 1,200 \nOutput 18,800 248,160 \n \nClosing WIP 1,000 9,200 \n 20,800 258,560 \n 7 Marks \n \n \n \n \n\n Workings \n \n Equivalent units Material Labour/Overhead \n Output 18,800 18,800 \n Add; Closing WIP 1,000 500 \n Less: Abnormal Gain 800 800 \n 19,000 18,500 \n Costs 100,000 148,000 \n Less: Scrap sale 1,200 \n 98,800 \n Cost per unit 98,800 = K5.2 148,800 = K8 \n 19000 18,500 \n \n \nValuation Output Abnormal Gain Closing WIP \nMaterial (18,800x5.2) 97,760 (800x5.2) 4,160 (1,000x5.2) 5,200 \nLabour/OH (18,800x8) 150,400 (800x8) 6,400 (500x8) 4,000 \n 248,160 10,560 9,200 \n \n (ii) Normal Loss Account \n K \n \nProcess Account 1,200 \n 1,200 \n K \nCash 240 \nAbnormal Gain 960 \n 1,200 1 Mark \n \n (iii) Abnormal Gain Account \n K \n Normal Loss 960 \n P & L Account 9,600 \n 10,560 \n K \n \nProcess Account 10,560 \n 10,560 1 Mark \n (TOTAL: 20 MARKS)",

    "answer": "5 (a) (i) Cost apportionment is the proportionate allotment of costs to cost \ncentres based on proxies. It ensures that there is a ‘fair’ share of \ncommon costs among costs centres despite the bases being more or less \narbitrary. 2 Marks \n \n(ii) Cost absorption is the distribution of costs into final products. It ensures \nthat all costs pertaining to cost centre are taken into account when setting \nthe selling price of the product to ensure recovery of such costs through \nthe selling price. 2 Marks \n \n (b) How budgets are used to fulfil each of the following: \n \n(i) Control – by comparing actual costs and revenues against those \nbudgeted to determine the variance which makes management operate a \n\nsystem of management by exception by concentrating on investigating \nsignificant deviations from the original budget. 2 Marks \n \n(ii) Motivation – budgets provide a standard which managers strive to \nachieve by providing them with a challenge (targets). Rewards are at \ntimes linked to achievement of targets in the budgets. 2 Marks \n \n(iii) Performance evaluation – managers’ performance is assessed by their \nability to meet the budgets at the end of the reporting period. 2 Marks \n \n(iv) Planning – budgets encourage managers to plan for future operations \nand consider how conditions in the next year might change and what \nsteps to take now in order to respond to these changed conditions. \n2 Marks \n \n(v) Coordinating activities – budgets bring together activities from different \ndepartments and reconcile them into a common plan. This ensures that \nthe activities in the organisation speak to each other (synchronized) to \nachieve a common goal. 2 Marks \n \n(c) (i) In a profit centre the manager is responsible for its costs and revenues. \nAn understanding and identification of such a centre ensures decisions \nare made on how to increase sales and reduce costs so as to maximize \nprofit. 2 Marks \n \n(ii) In a cost centre the manager is responsible only for costs. Identification \nof such centres ensure completeness in decisions involving costs such as \npricing decisions and cost control. 2 Marks \n \n(iii) In an investment centre the manager is responsible for investment \ndecisions as well as costs and revenues made. Such a centre ensures \ninformation is gathered for decisions on how or what to invest in so as \nto make the desired profit and therefore grow shareholder’s worth. \n2 Marks \n(TOTAL: 20 MARKS)",

    "question": "2 (a) (i) “Management accounting is the same as financial reporting”. Explain \ntwo reasons why this statement is not correct. 2 Marks \n \n(ii) Using your management accounting knowledge explain \n \n (1) Sunk cost 2 Marks \n \n (2) committed cost 2 Marks \n \n(b) Chagwa Ltd is preparing its budget for the forthcoming year. The Company has \nthree production department s, X, Y and Assembly a s well as two Service \nCentres, Canteen and Maintenance. The following information has been \nprovided to you. \n \n X Y Assembly Canteen Maintenance \nOverheads allocated & \nApportioned (K’000) 17,150 11,450 K22,160 9,750 13,250 \nCanteen (%) 35 22 23 - 20 \nMaintenance (%) 28 30 24 18 \nLabour hours 22,000 18,000 20,000 \nMachine hours 15,000 35,000 12,000 \n \n Department Y is a machine intensive. \n \n Required \n \n(i) Using the repeated distribution method, share the service centre s’ costs \nto production departments. (give your answer to the nearest kwacha) \n 11 Marks \n \n(ii) Determine the budgeted absorption rates for each production \ndepartments. 3 Marks \n(TOTAL: 20 MARKS)",
    "answer": "2 (a) (i) The statement “Management accounting is the same as financial \nreporting” is not correct because: \n \n(1) Financial reporting reports to those outside the organisation \nwhile management accounting reports to those inside the \norganisation for planning, directing and motivating, controlling \nand performance evaluation. \n \n(2) Financial reporting emphasis is on summaries of financial \nconsequences of past activities while management accounting \nemphasis is on decisions affecting the future. \n(3) Financial reporting emphasis on objectivity and verifiability \nwhile management accounting emphasis on relevance of items \nrelating to decision making. \n \n(4) Financial reporting requires precision of information while \nmanagement accounting requires timelines of information. \n \n(5) Financial reporting provides only summarised data for the entire \norganisation while management accounting provides detailed \nsegment reports about departments, products, customers and \nemployees. \n \n(6) Financial reporting is a must to follow international Accounting \nStandards while management accounting does not require a need \nto follow IAS and IFRS’. \n \n(7) It is mandatory for external reporting for financial reporting and \nis not mandatory for management accounting. \nAny two, 1 mark each = 2 Marks \n \n(ii) (1) Sunk cost is a cost already incurred (a past cost). Since it has \nbee already incurred the cost can not affect any decision being \nconsidered. 2 Marks \n \n(2) Committed cost is a future cost but was already agreed by \nseparate previous decisions. Such as the cost can not affect any \ndecision being taken now. 2 Marks \n \n \n\n (b) (i) \n \n A B Assembly Canteen Maintenance \n K’000 K’000 K’000 K’000 K’000 \nOverhead allocated appor. 17,150 11,450 22,160 9,750 13,250 \nReap – Canteen (Percentage) 3,413 2,145 2,242 (9,750) 1,950 \n 15,200 \nReap-Maint. (Percentage) 4,256 4,560 3,648 2,736 (15,200) \nCanteen (2nd phase) 958 602 629 (2,376) 547 \nMaintenance (2nd phase) 153 164 131 98 (546) \nCanteen (3rd phase) 34 21 23 (98) 20 \nMaintenance (3rd phase) 6 6 5 3 (20) \nCanteen 1 1 1 (3) 0 \n 25,971 18,949 28,829 0 0 \n 11 Marks \n \n (ii) \n A B Assembly \nCost 25,971 18,949 28,839 \nLabour 22 20 \nMachine hr 35 \nAR K1,181/labour hr K541/machine hr K1,442/labour hr \n3 Marks \n(TOTAL: 20 MARKS",
