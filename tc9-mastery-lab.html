    "examinerNote": "This question examined management accounting concepts and overhead apportionment using the repeated distribution method. Candidates performed well on this question. Part (a) (i) required candidates to explain if management accounting is the same as financial accounting. M ost candidates correctly explained that management accounting differs from financial accounting in terms of purpose, users, and reporting format. Some candidates only gave one point instead of two. Part (a) (ii) was about explanation of s unk Cost and Committed Cost. The explanations were generally satisfactory. However, candidates struggled with the definition of committed cost, resulting in loss of marks. Part (b) (i) required candidates to demonstrate how service centres’ cost can be reapportioned using r epeated distribution. This part was poorly attempted by most candidates. Common weaknesses included failure to repeat allocations until service department balances were nil, incorrect use of percentage bases, and arithmetical errors. Candidates who clearly showed iterative reallocations and final apportionments scored high marks. In Part (b) (ii) candidates were tasked on b udgeted absorption rates. Most candidates correctl y selected appropriate activity bases. They correctly recognised that Department Y was machine intensive and correctly used machine hours as the absorption base. However, most candidates got wrong absorption rates because they had divided values which were rounded off to thousands with labour or machine hours which were not rounded off to thousands. The failure by most candidates shows inadequate of preparedness. They do not thoroughly study what is covered in practice questions. Tuition providers need to have more time of practising questions with candidates.",

eliable with delivery times and quality? \n \n- Does the company wish to be flexible and maintain better control \nover operations by doing everything itself? \nAny four, 1 mark each = 4 Marks \n \n (c) (i) An opportunity cost is the benefit forgone by selecting one course of \naction in preference to the next best alternative. 1 Mark \n \nOr \n \nIs a benefit sacrificed in choosing the best course of action. \n \n (ii) a differential cost is the difference in total cost between alternatives. \n1 Mark \n \n (iii) a breakeven point is a point at which there is neither profit or loss. \n1 Mark \n(TOTAL: 20 MARKS)",

function parseRoute(){const h=(location.hash||'#dashboard').slice(1);const m=h.match(/^chapter-(\d+)/); if(m){state.route='chapter';state.chapter=+m[1]}else state.route=h.split('?')[0]||'dashboard'}
async function init(){state.chapters=window.TC9_CHAPTERS||[];state.questions=window.TC9_QUESTIONS||[];updateChrome();window.addEventListener('hashchange',render);bindShell();render()}
function bindShell(){ $('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open'); $('#focusBtn').onclick=()=>{document.body.classList.toggle('focus-mode');user.settings.focus=document.body.classList.contains('focus-mode');save()}; if(user.settings?.focus)document.body.classList.add('focus-mode'); $('#searchBtn').onclick=openSearch;$('#closeSearch').onclick=closeSearch;$('#searchModal').addEventListener('click',e=>{if(e.target.id==='searchModal')closeSearch()});$('#globalSearch').addEventListener('input',doSearch);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeSearch()});}
function render(){parseRoute();setActiveNav();$('#sidebar').classList.remove('open');const v=$('#view');if(state.route==='dashboard')v.innerHTML=dashboardView();else if(state.route==='chapters')v.innerHTML=chaptersView();else if(state.route==='chapter')v.innerHTML=chapterView(state.chapter);else if(state.route==='practice')v.innerHTML=practiceView();else if(state.route==='flashcards')v.innerHTML=flashcardsView();else if(state.route==='papers')v.innerHTML=papersView();else if(state.route==='exam')v.innerHTML=examView();else if(state.route==='coach')v.innerHTML=coachView();else v.innerHTML=dashboardView();bindView()}
function dashboardView(){const p=overallPct();const weakest=[...state.chapters].sort((a,b)=>pctChapter(a.n)-pctChapter(b.n)).slice(0,3);const today=new Date().toISOString().slice(0,10),done=user.dailyDone?.[today];return `
<section class="hero-panel"><div><div class="section-kicker">ICAM T3.2 · COSTING & BUDGETARY CONTROL</div><h1 class="hero-title">Study less randomly.<br>Master what earns marks.</h1><p class="lead">One place for all 14 chapters, targeted videos, official past-paper questions and solutions, examiner traps, spaced flashcards, formula drills, timed exam practice and a source-guided coach.</p><div class="btnrow"><a class="btn teal" href="#practice">Start a 20-minute sprint →</a><a class="btn white" href="#chapters">Open chapter map</a></div></div><div class="hero-stats"><div class="stat"><b>${user.xp||0}</b><small>Total XP</small></div><div class="stat"><b>${user.streak||1}🔥</b><small>Study streak</small></div><div class="stat"><b>${p}%</b><small>Course mastery</small></div><div class="stat"><b>${Object.keys(user.attempts||{}).length}</b><small>Past-paper attempts</small></div></div></section>
<div class="grid grid-4" style="margin-top:18px"><div class="card metric"><div><h3>Mastered chapters</h3><strong>${Object.keys(user.completed||{}).length}/14</strong></div><div class="ring" style="--p:${p}"><b>${p}%</b></div></div><div class="card metric"><div><h3>Past-paper bank</h3><strong>35</strong><small>full official Q + solution sets</small></div><span style="font-size:34px">▤</span></div><div class="card metric"><div><h3>Flashcards</h3><strong>${state.chapters.reduce((a,c)=>a+c.flashcards.length,0)}</strong><small>source-aligned recall prompts</small></div><span style="font-size:34px">◫</span></div><div class="card metric"><div><h3>Mistakes logged</h3><strong>${(user.mistakes||[]).length}</strong><small>turn errors into revision targets</small></div><span style="font-size:34px">↺</span></div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><div class="section-kicker">TODAY'S SPRINT</div><h2>20 minutes. No wandering.</h2>${done?`<p class="success">✓ Daily sprint completed. Do another only if you still have energy.</p>`:`<ol><li>5 flashcards from your weakest chapter</li><li>1 formula drill</li><li>1 official past-paper question plan</li><li>Write one mistake or memory hook</li></ol><button class="btn amber" data-action="daily-sprint">Launch sprint</button>`}</div><div class="card"><div class="section-kicker">WEAK-SPOT RADAR</div><h2>Where to spend the next hour</h2>${weakest.map(c=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>Ch ${c.n}: ${esc(c.title)}</b><small>${pctChapter(c.n)}%</small></div><div class="progress"><i style="width:${pctChapter(c.n)}%"></i></div></div>`).join('')}<a class="btn ghost small" href="#chapter-${weakest[0].n}">Start weakest chapter</a></div></div>
<div class="card" style="margin-top:18px"><div class="section-kicker">EXAMINER PATTERN</div><h2>Three habits the reports keep rewarding</h2><div class="grid grid-3"><div><b>1 · Answer the instruction word</b><p class="subtext">If asked for importance, significance or impact, do not stop at a definition.</p></div><div><b>2 · Show full calculations</b><p class="subtext">A variance in hours or kilograms is not finished. Convert it to money and label F/A.</p></div><div><b>3 · Attempt calculations</b><p class="subtext">The reports repeatedly warn that avoiding computational parts makes passing very difficult.</p></div></div></div>`}
function chaptersView(){return `<div class="section-kicker">COURSE MAP</div><h1 class="page-title">All 14 chapters</h1><p class="subtext">The sequence follows your TC9 manual. Each chapter combines a walkthrough, formula bank, curated videos, flashcards, official past-paper questions and examiner traps.</p><div class="chapter-grid" style="margin-top:22px">${state.chapters.map(c=>`<a class="chapter-card" href="#chapter-${c.n}"><div class="chapter-num">CHAPTER ${String(c.n).padStart(2,'0')}</div><h3>${esc(c.title)}</h3><p>${esc(c.memory)}</p><div class="badges"><span class="badge ${c.examValue.includes('Very')?'hot':''}">${esc(c.examValue)} exam value</span><span class="badge ${c.difficulty.toLowerCase().includes('calculation')?'calc':''}">${esc(c.difficulty)}</span></div><div class="progress"><i style="width:${pctChapter(c.n)}%"></i></div></a>`).join('')}</div>`}
function chapterView(n){const c=chapter(n),q=qsForChapter(n),tab=state.chapterTab;return `<div class="chapter-hero"><div class="card"><div class="section-kicker">CHAPTER ${n}</div><h1 class="page-title">${esc(c.title)}</h1><p class="subtext">${esc(c.memory)}</p><div class="badges"><span class="badge hot">${esc(c.examValue)} exam value</span><span class="badge calc">${esc(c.difficulty)}</span><span class="badge">${esc(c.time)}</span></div><div style="margin-top:18px"><div style="display:flex;justify-content:space-between"><b>Mastery</b><span>${pctChapter(n)}%</span></div><div class="progress"><i style="width:${pctChapter(n)}%"></i></div></div></div><div class="card memory-card"><div class="section-kicker">MEMORY HOOK</div><div class="quote">“${esc(c.memory)}”</div><p class="subtext">Say it aloud before every practice session. It tells you what the chapter is really doing.</p><button class="btn ghost small" data-action="listen-chapter" data-chapter="${n}">🔊 Listen to chapter guide</button></div></div><div class="tabs" id="chapterTabs">${['learn','formulas','videos','flashcards','pastpapers','examcheck'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${({learn:'Walkthrough',formulas:'Formula bank',videos:'Videos',flashcards:'Flashcards',pastpapers:`Past papers (${q.length})`,examcheck:'Exam checklist'})[t]}</button>`).join('')}</div><div id="chapterTabBody">${chapterTabBody(c,tab)}</div>`}
function chapterTabBody(c,tab){if(tab==='learn')return `<div class="grid grid-2"><div class="card"><div class="section-kicker">NOTHING SKIPPED</div><h2>What this chapter covers</h2><ul class="coverage-list">${c.coverage.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card"><div class="section-kicker">FAST ROUTE</div><h2>If time is brutally short</h2><ol><li>Read the lesson blocks once.</li><li>Say the memory hook without looking.</li><li>Watch only the first video.</li><li>Do one formula drill if available.</li><li>Attempt one past-paper question before revealing the solution.</li></ol></div></div><div class="card" style="margin-top:16px">${c.lessons.map(l=>`<div class="lesson"><h3>${esc(l.title)}</h3><p>${esc(l.text)}</p></div>`).join('')}</div>`;
if(tab==='formulas')return c.formulas.length?`<div class="formula-grid">${c.formulas.map(f=>`<div class="formula"><small>${esc(f[0])}</small><code>${esc(f[1])}</code></div>`).join('')}</div><div class="card" style="margin-top:16px"><p><b>How to retain formulas:</b> do not chant symbols only. For every formula, say what the numerator and denominator mean, what units the answer must have, and what business question it answers.</p><button class="btn teal" data-action="start-drill" data-chapter="${c.n}">Open calculation drill</button></div>`:`<div class="card"><h2>This chapter is mainly conceptual.</h2><p class="subtext">Use flashcards and past-paper theory questions instead of forcing a formula where the manual does not require one.</p></div>`;
if(tab==='videos')return `<div class="video-grid">${c.videos.map(v=>videoCard(v)).join('')}</div><div class="card" style="margin-top:16px"><b>Video rule:</b> watch with paper. Pause before every worked step, predict what happens next, and then immediately attempt a question from this chapter. Passive watching feels fluent but does not create exam recall.</div>`;
if(tab==='flashcards')return `<div class="card"><h2>${c.flashcards.length} active-recall cards</h2><p class="subtext">Do them inside the spaced-repetition deck. Cards rated “Again” return sooner; “Easy” moves further out.</p><button class="btn teal" data-action="open-flash-chapter" data-chapter="${c.n}">Study Chapter ${c.n} cards</button></div><div class="grid grid-2" style="margin-top:14px">${c.flashcards.slice(0,6).map(f=>`<div class="card"><b>${esc(f[0])}</b><p class="subtext">${esc(f[1])}</p></div>`).join('')}</div>`;
if(tab==='pastpapers')return questionList(q,c.n);
if(tab==='examcheck')return `<div class="grid grid-2"><div class="card"><div class="section-kicker">BEFORE MOVING ON</div><h2>Can you do these without notes?</h2>${c.examChecklist.map((x,i)=>`<label style="display:flex;gap:10px;margin:10px 0"><input type="checkbox" data-check="${c.n}-${i}" ${user.completedChecks?.[`${c.n}-${i}`]?'checked':''}/><span>${esc(x)}</span></label>`).join('')}<button class="btn teal small" data-action="mark-chapter-ready" data-chapter="${c.n}">Mark chapter review complete</button></div><div class="card"><div class="section-kicker">EXAM VERBS</div><h2>Do not answer the wrong question</h2><p><b>Define:</b> precise meaning.</p><p><b>State/Mention:</b> brief points; no essay.</p><p><b>Explain:</b> point + why/how it matters.</p><p><b>Significance/Importance:</b> why the concept is useful or consequential.</p><p><b>Advise:</b> calculate/analyse, then give a justified recommendation.</p></div></div>`;return ''}
function videoCard(v){const id=(v[1].match(/[?&]v=([\w-]{11})/)||[])[1];return `<article class="video-card"><div class="video-wrap">${id?`<iframe loading="lazy" src="https://www.youtube.com/embed/${id}" title="${esc(v[0])}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`:`<div style="display:grid;place-items:center;height:100%;color:white;font-size:42px">▶</div>`}</div><div class="video-copy"><h4>${esc(v[0])}</h4><p>${esc(v[2])}</p><a class="btn ghost small" href="${esc(v[1])}" target="_blank" rel="noopener">Watch on YouTube ↗</a></div></article>`}
function questionList(qs,chapterFilter=null){if(!qs.length)return `<div class="card">No mapped past-paper question found for this chapter yet.</div>`;return `<div class="card" style="margin-bottom:14px"><div class="section-kicker">OFFICIAL PAPER BANK</div><h2>Attempt first. Reveal later.</h2><p class="subtext">Every card contains the original supplied question, the official suggested solution, and examiner commentary where an examiner report was supplied. A question can appear under more than one chapter because ICAM often mixes topics inside one 20-mark question.</p></div>${qs.map(q=>questionCard(q,chapterFilter)).join('')}`}
function questionCard(q,chapterFilter){const attempt=user.attempts?.[q.id];return `<article class="question-card" id="${q.id}"><div class="question-head"><div><div class="section-kicker">${esc(q.sitting)} · QUESTION ${q.questionNo}</div><h3>${q.chapters.map(n=>`Ch ${n}`).join(' · ')}</h3></div><div class="question-meta"><span class="badge ${attempt?'calc':''}">${attempt?`Attempted · ${attempt.rating||'unrated'}`:'Not attempted'}</span></div></div><div class="question-body"><div class="paper-text">${esc(q.question)}</div><div class="walk-box"><b>How to attack it</b><ol>${q.walkthrough.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div class="btnrow"><button class="btn teal small" data-action="mark-attempt" data-id="${q.id}">I attempted this</button><button class="btn ghost small" data-action="toggle-answer" data-id="${q.id}">Reveal official solution</button><button class="btn ghost small" data-action="coach-question" data-id="${q.id}">✦ Coach me</button></div><div class="reveal" id="ans-${q.id}" hidden><div class="answer-box"><b>Official suggested solution</b><div class="paper-text" style="margin-top:8px;max-height:520px">${esc(q.answer)}</div></div>${q.examinerNote?`<div class="examiner-box"><b>Examiner's warning from this sitting</b><p>${esc(q.examinerNote)}</p></div>`:''}<div class="selfmark"><b>How did your answer compare?</b><button data-action="rate-question" data-id="${q.id}" data-rate="Needs work">Needs work</button><button data-action="rate-question" data-id="${q.id}" data-rate="Almost">Almost</button><button data-action="rate-question" data-id="${q.id}" data-rate="Exam ready">Exam ready</button></div></div></div></article>`}
function practiceView(){return `<div class="section-kicker">PRACTICE LAB</div><h1 class="page-title">Turn knowledge into speed</h1><p class="subtext">Pick a chapter. The drill generator creates fresh numbers, checks the answer instantly and awards XP. It is deliberately repetitive: exam confidence comes from doing, not rereading.</p><div class="grid grid-3" style="margin-top:18px">${state.chapters.map(c=>`<button class="chapter-card" data-action="start-drill" data-chapter="${c.n}" style="text-align:left;cursor:pointer"><div class="chapter-num">CH ${c.n}</div><h3>${esc(c.title)}</h3><p>${c.formulas.length?'Calculation + method practice':'Theory recall + exam verb practice'}</p><span class="badge">${pctChapter(c.n)}% mastery</span></button>`).join('')}</div><div id="practiceStage" style="margin-top:20px"></div>`}
function flashcardsView(){const all=state.flashChapter==='all'?state.chapters.flatMap(c=>c.flashcards.map((f,i)=>({c:c.n,i,q:f[0],a:f[1]}))):chapter(+state.flashChapter).flashcards.map((f,i)=>({c:+state.flashChapter,i,q:f[0],a:f[1]}));const due=all.filter(card=>isCardDue(card));const deck=due.length?due:all;state._deck=deck;const card=deck[state.flashIndex%deck.length];return `<div class="section-kicker">SPACED REPETITION</div><h1 class="page-title">Flashcards that come back when you need them</h1><div class="btnrow"><select id="flashFilter" class="btn ghost"><option value="all">All chapters</option>${state.chapters.map(c=>`<option value="${c.n}" ${String(state.flashChapter)===String(c.n)?'selected':''}>Ch ${c.n} · ${esc(c.title)}</option>`).join('')}</select><span class="badge">${due.length} due now</span><span class="badge">${all.length} in deck</span></div>${card?`<div class="flashcard-stage"><div class="flashcard" id="flashcard" data-action="flip-card"><div class="flash-inner"><div class="flash-face flash-front"><div class="tiny">CHAPTER ${card.c} · TAP TO REVEAL</div><h2>${esc(card.q)}</h2></div><div class="flash-face flash-back"><div class="tiny">ANSWER</div><h2>${esc(card.a)}</h2></div></div></div><div class="rating-row"><button class="again" data-action="rate-card" data-rate="again">Again</button><button class="hard" data-action="rate-card" data-rate="hard">Hard</button><button class="good" data-action="rate-card" data-rate="good">Good</button><button class="easy" data-action="rate-card" data-rate="easy">Easy</button></div><p class="subtext" style="text-align:center">Rate the recall, not how familiar the answer looks.</p></div>`:'<div class="card">No cards available.</div>'}`}
function isCardDue(card){const k=`${card.c}-${card.i}`,d=user.flash?.[k]?.due;if(!d)return true;return Date.now()>=d}
function rateCard(rate){const card=state._deck[state.flashIndex%state._deck.length],k=`${card.c}-${card.i}`,rec=user.flash?.[k]||{box:0};const delta={again:0,hard:1,good:2,easy:3}[rate];rec.box=Math.max(0,Math.min(6,rate==='again'?0:rec.box+delta));const days=[0,1,3,7,14,30,60][rec.box];rec.due=Date.now()+days*86400000;user.flash=user.flash||{};user.flash[k]=rec;save();chapXP(card.c,rate==='again'?1:rate==='hard'?2:rate==='good'?4:6);state.flashIndex++;render()}
function papersView(){const sit=[...new Set(state.questions.map(q=>q.sitting))];return `<div class="section-kicker">PAST PAPER LIBRARY</div><h1 class="page-title">Seven sittings, one organised bank</h1><p class="subtext">December 2022 to December 2025. Filter by sitting or jump into a chapter so mixed questions are placed in context.</p><div class="btnrow" style="margin:14px 0"><select id="paperFilter" class="btn ghost"><option value="all">All sittings</option>${sit.map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="paperChapterFilter" class="btn ghost"><option value="all">All chapters</option>${state.chapters.map(c=>`<option value="${c.n}">Chapter ${c.n}</option>`).join('')}</select></div><div id="paperList">${questionList(state.questions)}</div>`}
function examView(){if(!state.exam)return `<div class="arena"><div class="section-kicker">EXAM ARENA</div><h1 class="page-title">Simulate the pressure before the real paper</h1><p>Generate five 20-mark questions from the supplied official papers. You get a 3-hour timer, scratch space, question navigation and post-exam official solutions.</p><div class="btnrow"><button class="btn amber" data-action="start-exam" data-mode="full">Start 3-hour mock</button><button class="btn white" data-action="start-exam" data-mode="sprint">Start 36-minute single-question sprint</button></div></div><div class="grid grid-3" style="margin-top:18px"><div class="card"><b>Reading-time rule</b><p class="subtext">Use the first minutes to identify topics, command verbs and question order. Do not start blindly.</p></div><div class="card"><b>Working rule</b><p class="subtext">Show formulas and workings. Method marks matter even when arithmetic goes wrong.</p></div><div class="card"><b>Completion rule</b><p class="subtext">Answer every question. Examiner reports repeatedly flag incomplete scripts.</p></div></div>`;return examSessionView()}
function startExam(mode){const pool=[...state.questions].sort(()=>Math.random()-.5);const qs=mode==='sprint'?pool.slice(0,1):pool.slice(0,5);state.exam={mode,qs,index:0,end:Date.now()+(mode==='sprint'?36:180)*60000,answers:{},done:false};render();examTick()}
function examSessionView(){const e=state.exam,q=e.qs[e.index],left=Math.max(0,e.end-Date.now());const mins=Math.floor(left/60000),sec=Math.floor((left%60000)/1000);return `<div class="arena"><div style="display:flex;justify-content:space-between;gap:18px;align-items:flex-start"><div><div class="section-kicker">${e.mode==='sprint'?'QUESTION SPRINT':'FULL MOCK'}</div><h1 class="page-title">Question ${e.index+1} of ${e.qs.length}</h1><div class="exam-qnav">${e.qs.map((_,i)=>`<button class="${i===e.index?'active':''}" data-action="exam-go" data-index="${i}">${i+1}</button>`).join('')}</div></div><div><div class="timer" id="examTimer">${String(mins).padStart(2,'0')}:${String(sec).padStart(2,'0')}</div><button class="btn amber small" data-action="finish-exam">Finish & review</button></div></div></div><div class="question-card" style="margin-top:16px"><div class="question-head"><h3>${esc(q.sitting)} · Official Question ${q.questionNo}</h3><span class="badge">${q.chapters.map(n=>'Ch '+n).join(' · ')}</span></div><div class="question-body"><div class="paper-text">${esc(q.question)}</div><h3>Your workings / answer</h3><textarea class="exam-work" id="examWork" placeholder="Write your plan, formulas and workings here…">${esc(e.answers[q.id]||'')}</textarea><div class="btnrow" style="margin-top:10px"><button class="btn ghost small" data-action="exam-prev">← Previous</button><button class="btn teal small" data-action="exam-next">Save & next →</button></div></div></div>`}
function examTick(){clearInterval(examTick._i);examTick._i=setInterval(()=>{if(!state.exam)return clearInterval(examTick._i);const left=Math.max(0,state.exam.end-Date.now()),mins=Math.floor(left/60000),sec=Math.floor((left%60000)/1000);const el=$('#examTimer');if(el)el.textContent=`${String(mins).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if(left<=0)finishExam()},1000)}
function saveExamWork(){if(!state.exam)return;const q=state.exam.qs[state.exam.index],el=$('#examWork');if(el)state.exam.answers[q.id]=el.value}
function finishExam(){saveExamWork();clearInterval(examTick._i);const e=state.exam;e.done=true;const view=$('#view');view.innerHTML=`<div class="section-kicker">POST-EXAM REVIEW</div><h1 class="page-title">Mark the process, not your confidence</h1><p class="subtext">Compare your workings with the official suggested solutions. For every missed step, add one mistake-log entry.</p>${e.qs.map(q=>`<div class="question-card"><div class="question-head"><h3>${esc(q.sitting)} · Q${q.questionNo}</h3></div><div class="question-body"><h4>Your answer</h4><div class="paper-text">${esc(e.answers[q.id]||'(No answer written)')}</div><h4>Official solution</h4><div class="paper-text">${esc(q.answer)}</div>${q.examinerNote?`<div class="examiner-box"><b>Examiner note</b><p>${esc(q.examinerNote)}</p></div>`:''}<div class="selfmark"><button data-action="rate-question" data-id="${q.id}" data-rate="Needs work">Needs work</button><button data-action="rate-question" data-id="${q.id}" data-rate="Almost">Almost</button><button data-action="rate-question" data-id="${q.id}" data-rate="Exam ready">Exam ready</button><button data-action="log-mistake" data-id="${q.id}">+ Mistake log</button></div></div></div>`).join('')}<button class="btn teal" data-action="reset-exam">New exam</button>`;bindView();addXP(e.mode==='sprint'?15:40,'Mock completed')}
function coachView(){const ch=chapter(state.chapter||1);return `<div class="section-kicker">SOURCE-GUIDED COACH</div><h1 class="page-title">Get unstuck without giving away the learning</h1><p class="subtext">The built-in coach searches the TC9 chapter maps, formulas and official question bank. For deeper AI help, it builds a source-grounded prompt you can copy into ChatGPT.</p><div class="grid grid-2" style="margin-top:18px"><div class="card"><div id="coachChat" class="coach-chat"><div class="bubble bot"><b>Coach:</b> Tell me the chapter/topic or paste what is confusing you. I will first give a hint and method, not dump the answer.</div></div><div class="coach-actions"><button data-prompt="Explain this in very simple English">Simplify</button><button data-prompt="Give me only the next step, not the full answer">Hint only</button><button data-prompt="Quiz me on this until I can explain it back">Quiz me</button><button data-prompt="Show me the common examiner mistake on this topic">Exam trap</button></div><div class="coach-compose"><textarea id="coachInput" placeholder="e.g. I keep confusing fixed overhead volume and expenditure variance"></textarea><button class="btn teal" data-action="coach-send">Ask</button></div></div><div><div class="card"><div class="section-kicker">AI ASSIST</div><h2>Ask ChatGPT with the right context</h2><p class="subtext">This creates a prompt that tells ChatGPT the TC9 chapter, your question, the exam style and that it must teach before revealing the answer.</p><label>Chapter context</label><select id="coachChapter" class="btn ghost" style="width:100%;margin:7px 0 12px">${state.chapters.map(c=>`<option value="${c.n}" ${c.n===state.chapter?'selected':''}>Chapter ${c.n}: ${esc(c.title)}</option>`).join('')}</select><button class="btn amber" data-action="copy-ai-prompt">Copy AI tutor prompt & open ChatGPT</button><small style="display:block;margin-top:10px;color:var(--muted)">Your study data stays in this browser. The copied prompt includes only the chapter/topic you select and your text.</small></div><div class="card" style="margin-top:14px"><div class="section-kicker">MISTAKE LOG</div><h2>${(user.mistakes||[]).length} errors converted into revision targets</h2>${(user.mistakes||[]).slice(-4).reverse().map(m=>`<div class="mistake"><span class="badge">${esc(m.chapter||'TC9')}</span><div><b>${esc(m.title)}</b><small style="display:block;color:var(--muted)">${esc(m.note||'Review this before the next mock.')}</small></div><button class="btn ghost small" data-action="remove-mistake" data-mid="${m.id}">×</button></div>`).join('')||'<p class="subtext">No mistakes logged yet. That usually means you need to attempt more questions, not that there are no weaknesses.</p>'}</div></div></div>`}
function smartCoach(text){const t=text.toLowerCase();let best=null,score=0;for(const c of state.chapters){let s=0;for(const x of [...c.coverage,...c.flashcards.flat()]){for(const w of t.split(/\W+/).filter(w=>w.length>4))if(String(x).toLowerCase().includes(w))s++}if(s>score){score=s;best=c}}best=best||chapter(state.chapter)||state.chapters[0];const flash=best.flashcards.find(f=>t.split(/\W+/).some(w=>w.length>4&&f.join(' ').toLowerCase().includes(w)))||best.flashcards[0];return {chapter:best,answer:`Start with Chapter ${best.n}: ${best.title}. ${flash?flash[1]:best.memory} Your next move: ${best.examChecklist[0]} Then attempt one past-paper question before checking the solution.`}}
function bindView(){const v=$('#view');v.onclick=e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='daily-sprint'){nav('flashcards');setTimeout(()=>toast('Start with 5 cards, then go to Practice Lab.'),200)}else if(a==='start-drill')startDrill(+el.dataset.chapter);else if(a==='open-flash-chapter'){state.flashChapter=el.dataset.chapter;state.flashIndex=0;nav('flashcards')}else if(a==='flip-card')$('#flashcard')?.classList.toggle('flipped');else if(a==='rate-card')rateCard(el.dataset.rate);else if(a==='toggle-answer'){const x=$(`#ans-${CSS.escape(el.dataset.id)}`);x.hidden=!x.hidden}else if(a==='mark-attempt'){const id=el.dataset.id;user.attempts=user.attempts||{};user.attempts[id]=user.attempts[id]||{date:Date.now()};save();addXP(4,'Question attempted');render()}else if(a==='rate-question')rateQuestion(el.dataset.id,el.dataset.rate);else if(a==='coach-question'){const q=state.questions.find(x=>x.id===el.dataset.id);state.chapter=q.chapters[0];nav('coach');setTimeout(()=>{$('#coachInput').value=`Help me tackle ${q.sitting} Question ${q.questionNo}. Do not give the full answer first.`;},50)}else if(a==='listen-chapter')speakChapter(+el.dataset.chapter);else if(a==='mark-chapter-ready'){user.completed[el.dataset.chapter]=true;chapXP(+el.dataset.chapter,25);render()}else if(a==='start-exam')startExam(el.dataset.mode);else if(a==='exam-go'){saveExamWork();state.exam.index=+el.dataset.index;render();examTick()}else if(a==='exam-prev'){saveExamWork();state.exam.index=Math.max(0,state.exam.index-1);render();examTick()}else if(a==='exam-next'){saveExamWork();state.exam.index=Math.min(state.exam.qs.length-1,state.exam.index+1);render();examTick()}else if(a==='finish-exam')finishExam();else if(a==='reset-exam'){state.exam=null;render()}else if(a==='coach-send')coachSend();else if(a==='copy-ai-prompt')copyAIPrompt();else if(a==='log-mistake')logMistake(el.dataset.id);else if(a==='remove-mistake'){user.mistakes=user.mistakes.filter(m=>String(m.id)!==String(el.dataset.mid));save();render()}};
const tabs=$('#chapterTabs');if(tabs)tabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.chapterTab=b.dataset.tab;render()};
$$('[data-check]',v).forEach(cb=>cb.onchange=()=>{user.completedChecks=user.completedChecks||{};user.completedChecks[cb.dataset.check]=cb.checked;save()});
const ff=$('#flashFilter');if(ff)ff.onchange=()=>{state.flashChapter=ff.value;state.flashIndex=0;render()};
const pf=$('#paperFilter'),pcf=$('#paperChapterFilter');if(pf)pf.onchange=filterPapers;if(pcf)pcf.onchange=filterPapers;
$$('.coach-actions button',v).forEach(b=>b.onclick=()=>{$('#coachInput').value=b.dataset.prompt;$('#coachInput').focus()});}
function filterPapers(){const s=$('#paperFilter').value,c=$('#paperChapterFilter').value;let q=state.questions;if(s!=='all')q=q.filter(x=>x.sitting===s);if(c!=='all')q=q.filter(x=>x.chapters.includes(+c));$('#paperList').innerHTML=questionList(q)}
function rateQuestion(id,rate){user.attempts=user.attempts||{};user.attempts[id]={...(user.attempts[id]||{}),rating:rate,date:Date.now()};const q=state.questions.find(x=>x.id===id),pts=rate==='Exam ready'?15:rate==='Almost'?8:3;save();chapXP(q.chapters[0],pts);if(rate==='Needs work')logMistake(id,false);render()}
function logMistake(id,rerender=true){const q=state.questions.find(x=>x.id===id);user.mistakes=user.mistakes||[];user.mistakes.push({id:Date.now(),chapter:`Ch ${q.chapters[0]}`,title:`${q.sitting} Q${q.questionNo}`,note:'Reattempt this question without the solution, then explain the method aloud.'});save();toast('Added to mistake log');if(rerender)render()}
function speakChapter(n){const c=chapter(n);if(!('speechSynthesis'in window))return toast('Speech not supported in this browser');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`${c.title}. ${c.memory}. ${c.lessons.map(x=>x.title+'. '+x.text).join(' ')}`);u.rate=.92;speechSynthesis.speak(u);toast('Reading chapter guide aloud')}
function coachSend(){const inp=$('#coachInput'),text=inp.value.trim();if(!text)return;const chat=$('#coachChat');chat.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(text)}</div>`);const r=smartCoach(text);chat.insertAdjacentHTML('beforeend',`<div class="bubble bot"><b>Coach · Ch ${r.chapter.n}</b><br>${esc(r.answer)}<br><br><a href="#chapter-${r.chapter.n}">Open this chapter →</a></div>`);chat.scrollTop=chat.scrollHeight;inp.value='';addXP(2,'Active question')}
async function copyAIPrompt(){const n=+$('#coachChapter').value,c=chapter(n),text=$('#coachInput').value.trim();const prompt=`You are tutoring me for ICAM T3.2 Costing & Budgetary Control. I am studying Chapter ${n}: ${c.title}. Use ICAM-style terminology. Chapter scope: ${c.coverage.join('; ')}. My difficulty/question: ${text||'Quiz me and identify my weakest point.'}\n\nTeaching rules: explain in very simple English but keep full technical accuracy; do not jump straight to the final answer; first make me identify the requirement, relevant formula/concept, and first step; use a small worked example if needed; then give me a similar exam-style practice item; when I answer, mark the method and explain errors. Pay special attention to command verbs such as explain, significance, impact and advise.`;await navigator.clipboard.writeText(prompt);window.open('https://chatgpt.com/','_blank');toast('AI tutor prompt copied — paste it into ChatGPT')}
function openSearch(){$('#searchModal').hidden=false;$('#globalSearch').value='';$('#searchResults').innerHTML='<p class="subtext" style="padding:10px">Type a topic, formula, question year or chapter name.</p>';setTimeout(()=>$('#globalSearch').focus(),20)}function closeSearch(){$('#searchModal').hidden=true}
function doSearch(){const t=$('#globalSearch').value.toLowerCase().trim();if(!t)return;let hits=[];for(const c of state.chapters){const blob=[c.title,c.memory,...c.coverage,...c.formulas.flat(),...c.flashcards.flat()].join(' ').toLowerCase();if(blob.includes(t))hits.push({href:`#chapter-${c.n}`,title:`Chapter ${c.n}: ${c.title}`,sub:c.memory})}for(const q of state.questions){if((q.question+' '+q.answer).toLowerCase().includes(t))hits.push({href:`#papers`,title:`${q.sitting} · Question ${q.questionNo}`,sub:`Mapped to ${q.chapters.map(n=>'Ch '+n).join(', ')}`})}$('#searchResults').innerHTML=hits.slice(0,14).map(h=>`<a class="search-hit" href="${h.href}" onclick="document.getElementById('searchModal').hidden=true"><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></a>`).join('')||'<p class="subtext" style="padding:10px">No direct match. Try a shorter term such as “EOQ”, “variance”, “contract” or “cash budget”.</p>'}
// ----- DRILLS -----
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a; const money=n=>'K'+Math.round(n).toLocaleString();
function startDrill(n){state.chapter=n;const stage=$('#practiceStage')||$('#chapterTabBody');if(!stage){nav('practice');setTimeout(()=>startDrill(n),50);return}const d=makeDrill(n);state._drill=d;stage.innerHTML=`<div class="card drill-box"><div class="section-kicker">CHAPTER ${n} · GENERATED DRILL</div><h2>${esc(d.title)}</h2><div class="drill-problem">${esc(d.prompt)}</div>${d.units?`<p class="subtext">Answer unit: ${esc(d.units)}</p>`:''}<div class="answer-input"><input id="drillAnswer" inputmode="decimal" placeholder="Type your answer"><button class="btn teal" data-action="check-drill">Check</button></div><div class="hint"><b>Hint:</b> ${esc(d.hint)}</div><div id="drillResult"></div><div class="btnrow" style="margin-top:12px"><button class="btn ghost small" data-action="new-drill" data-chapter="${n}">New numbers</button><button class="btn ghost small" data-action="show-drill-method">Show method</button></div><div id="drillMethod" class="walk-box" hidden>${d.steps.map((s,i)=>`${i+1}. ${esc(s)}<br>`).join('')}</div></div>`;bindDrill(stage)}
function bindDrill(stage){stage.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='check-drill')checkDrill();if(b.dataset.action==='new-drill')startDrill(+b.dataset.chapter);if(b.dataset.action==='show-drill-method')$('#drillMethod').hidden=false},{once:false})}
function checkDrill(){const v=parseFloat($('#drillAnswer').value.replace(/,/g,'')),d=state._drill;if(Number.isNaN(v))return toast('Enter a number first');const tol=Math.max(.01,Math.abs(d.answer)*.005),ok=Math.abs(v-d.answer)<=tol;$('#drillResult').innerHTML=ok?`<p class="success">✓ Correct. ${esc(d.explain)}</p>`:`<p class="danger">Not yet. Expected about ${d.display||d.answer}. Open the method, find the first step that differs, and try again.</p>`;if(ok){chapXP(state.chapter,8);user.dailyDone=user.dailyDone||{};user.dailyDone[new Date().toISOString().slice(0,10)]=true;save()}}
function makeDrill(n){switch(n){case 1:{const lo=rand(400,800)*10,b=rand(4,14),hi=lo+rand(200,500)*10,f=rand(20000,60000),c1=f+b*lo,c2=f+b*hi;return {title:'High–low cost separation',prompt:`At ${lo.toLocaleString()} units total cost is ${money(c1)}. At ${hi.toLocaleString()} units total cost is ${money(c2)}. What is the variable cost per unit?`,units:'K per unit',answer:b,display:`K${b}`,hint:'Use the change in total cost divided by the change in activity.',steps:[`Change in cost = ${money(c2-c1)}.`,`Change in activity = ${(hi-lo).toLocaleString()} units.`,`Variable rate = ${money(c2-c1)} ÷ ${(hi-lo).toLocaleString()} = K${b} per unit.`],explain:'You used the activity extremes correctly.'}}case 2:{const max=rand(60,120),lead=rand(5,12);return {title:'Reorder level',prompt:`Maximum usage is ${max} units per day and maximum lead time is ${lead} days. Calculate the reorder level.`,units:'units',answer:max*lead,display:(max*lead).toLocaleString(),hint:'Reorder level protects you during the worst-case usage and lead-time combination.',steps:[`Formula = maximum usage × maximum lead time.`,`${max} × ${lead} = ${max*lead} units.`],explain:'That is the stock trigger for placing a new order.'}}case 3:{const hours=rand(130,160),ot=rand(8,30),rate=rand(800,2500),prem=.5;const ans=(hours+ot)*rate+ot*rate*prem;return {title:'Overtime wage',prompt:`A worker has ${hours} basic hours plus ${ot} overtime hours. Basic rate is K${rate.toLocaleString()} per hour and overtime carries a 50% premium. Calculate total wages.`,units:'K',answer:ans,display:money(ans),hint:'Overtime hours receive normal basic pay PLUS the premium.',steps:[`Basic pay for all hours = (${hours}+${ot}) × K${rate.toLocaleString()}.`,`Overtime premium = ${ot} × K${rate.toLocaleString()} × 50%.`,`Add both amounts = ${money(ans)}.`],explain:'You separated normal pay from the overtime premium.'}}case 4:{const oh=rand(120,280)*1000,h=rand(7000,14000),actualH=rand(6500,15000),actualOH=rand(120,290)*1000,oar=oh/h,abs=oar*actualH,diff=abs-actualOH;return {title:'Overhead absorption rate',prompt:`Budgeted production overhead is ${money(oh)} for ${h.toLocaleString()} labour hours. Calculate the predetermined overhead absorption rate per labour hour.`,units:'K per labour hour',answer:oar,display:`K${oar.toFixed(2)}`,hint:'Budgeted overhead ÷ budgeted activity.',steps:[`${money(oh)} ÷ ${h.toLocaleString()} hours`,`OAR = K${oar.toFixed(2)} per labour hour.`,`At ${actualH.toLocaleString()} actual hours this rate would absorb about ${money(abs)}; comparing that with actual overhead ${money(actualOH)} tells you over/under absorption.`],explain:'You used the budgeted denominator, which is the exam-safe method.'}}case 5:{const sp=rand(1200,3500),vc=rand(600,sp-200),units=rand(500,1800),fc=rand(200,600)*1000,con=(sp-vc)*units,profit=con-fc;return {title:'Contribution and profit',prompt:`Selling price is K${sp.toLocaleString()} per unit, variable cost is K${vc.toLocaleString()} per unit, sales are ${units.toLocaleString()} units and fixed costs are ${money(fc)}. Calculate total contribution.`,units:'K',answer:con,display:money(con),hint:'Unit contribution × units sold.',steps:[`Unit contribution = K${sp.toLocaleString()} − K${vc.toLocaleString()} = K${(sp-vc).toLocaleString()}.`,`Total contribution = K${(sp-vc).toLocaleString()} × ${units.toLocaleString()} = ${money(con)}.`,`Profit would then be contribution − fixed costs = ${money(profit)}.`],explain:'Contribution is the bridge between sales and profit.'}}case 6:{const pool=rand(200,700)*1000,drivers=rand(100,350),used=rand(5,35),rate=pool/drivers,ans=rate*used;return {title:'ABC cost-driver rate',prompt:`Setup cost pool is ${money(pool)} and there are ${drivers} setups in total. Product X uses ${used} setups. What setup overhead should Product X receive?`,units:'K',answer:ans,display:money(ans),hint:'First find cost per setup, then multiply by Product X setups.',steps:[`Driver rate = ${money(pool)} ÷ ${drivers} = K${rate.toFixed(2)} per setup.`,`Product X overhead = ${used} × K${rate.toFixed(2)} = ${money(ans)}.`],explain:'You followed the two-stage ABC assignment.'}}case 7:{const price=rand(8,20)*1e6,cost=rand(4,8)*1e6,toComplete=rand(1,4)*1e6,cert=rand(30,70)/100*price,est=price-(cost+toComplete),ans=cert/price*est;return {title:'Attributable contract profit',prompt:`Contract price ${money(price)}. Cost to date plus uncertified work totals ${money(cost)}. Estimated cost to complete ${money(toComplete)}. Work certified ${money(cert)}. Using the manual's value-certified / contract-price approach, estimate attributable profit.`,units:'K',answer:ans,display:money(ans),hint:'Estimate total profit first, then apply the certified proportion.',steps:[`Estimated total cost = ${money(cost+toComplete)}.`,`Estimated total profit = ${money(price)} − ${money(cost+toComplete)} = ${money(est)}.`,`Certified proportion = ${money(cert)} ÷ ${money(price)}.`,`Attributable profit ≈ ${money(ans)}.`],explain:'You separated total contract profit from the portion recognised to date.'}}case 8:{const input=rand(8000,20000),loss=rand(3,8)/100,actualLoss=Math.round(input*(loss+0.01)),normal=Math.round(input*loss),ab=actualLoss-normal;return {title:'Normal and abnormal process loss',prompt:`Input is ${input.toLocaleString()} units. Normal loss is ${(loss*100).toFixed(0)}% of input. Actual loss is ${actualLoss.toLocaleString()} units. Calculate abnormal loss in units.`,units:'units',answer:ab,display:ab.toLocaleString(),hint:'Expected normal loss first, then compare actual loss with it.',steps:[`Normal loss = ${input.toLocaleString()} × ${(loss*100).toFixed(0)}% = ${normal.toLocaleString()} units.`,`Abnormal loss = actual loss ${actualLoss.toLocaleString()} − normal loss ${normal.toLocaleString()} = ${ab.toLocaleString()} units.`],explain:'Physical-unit reconciliation comes before cost valuation.'}}case 9:{return theoryDrill(n,'Which standard allows normal losses and machine breakdowns?','Attainable standard','Ideal standard','Attainable standard','Basic standard','Current standard')}case 10:{const sales=rand(1000,3000),close=rand(100,500),open=rand(100,500),ans=sales+close-open;return {title:'Production budget',prompt:`Budgeted sales are ${sales.toLocaleString()} units. Desired closing finished goods are ${close.toLocaleString()} units and opening finished goods are ${open.toLocaleString()} units. Calculate production units.`,units:'units',answer:ans,display:ans.toLocaleString(),hint:'Sales + closing inventory − opening inventory.',steps:[`${sales.toLocaleString()} + ${close.toLocaleString()} − ${open.toLocaleString()} = ${ans.toLocaleString()} units.`],explain:'You used closing inventory as an addition and opening inventory as a deduction.'}}case 11:{const fixed=rand(100,300)*1000,vr=rand(20,80),act=rand(3000,7000),ans=fixed+vr*act;return {title:'Flexible budget total cost',prompt:`Fixed cost is ${money(fixed)} and variable cost is K${vr} per unit. Actual activity is ${act.toLocaleString()} units. Flex the total cost to actual activity.`,units:'K',answer:ans,display:money(ans),hint:'Keep fixed cost fixed; flex the variable part.',steps:[`Variable cost = ${act.toLocaleString()} × K${vr} = ${money(vr*act)}.`,`Flexible total = ${money(fixed)} + ${money(vr*act)} = ${money(ans)}.`],explain:'Now the budget is comparable with actual performance at the same volume.'}}case 12:{const sq=rand(800,1500),aq=sq+rand(-100,150),sp=rand(10,40),ans=(sq-aq)*sp;return {title:'Material usage variance',prompt:`Standard quantity for actual output is ${sq} kg. Actual quantity used is ${aq} kg. Standard price is K${sp} per kg. Calculate material usage variance; enter a positive number for favourable and a negative number for adverse.`,units:'K (F positive, A negative)',answer:ans,display:`${money(Math.abs(ans))} ${ans>=0?'F':'A'}`,hint:'Standard price × (standard quantity − actual quantity).',steps:[`Quantity difference = ${sq} − ${aq} = ${sq-aq} kg.`,`× K${sp} = ${money(Math.abs(ans))}.`,`Because ${sq-aq>=0?'actual usage is below standard':'actual usage exceeds standard'}, it is ${ans>=0?'favourable':'adverse'}.`],explain:'You finished the variance in money and interpreted F/A.'}}case 13:{const fc=rand(300,800)*1000,sp=rand(1200,3000),vc=rand(500,sp-250),uc=sp-vc,ans=fc/uc;return {title:'Break-even units',prompt:`Fixed costs are ${money(fc)}. Selling price is K${sp.toLocaleString()} per unit and variable cost is K${vc.toLocaleString()} per unit. Calculate break-even units.`,units:'units',answer:ans,display:`${Math.ceil(ans).toLocaleString()} units (round up for whole units)`,hint:'Fixed cost ÷ unit contribution.',steps:[`Unit contribution = K${sp.toLocaleString()} − K${vc.toLocaleString()} = K${uc.toLocaleString()}.`,`Break-even = ${money(fc)} ÷ K${uc.toLocaleString()} = ${ans.toFixed(2)} units.`,`For whole units, round up to ${Math.ceil(ans).toLocaleString()}.`],explain:'At this volume total contribution covers fixed cost exactly.'}}case 14:{const offer=rand(900,1800),varc=rand(500,offer-100),units=rand(500,1500),extra=rand(0,120)*1000,ans=(offer-varc)*units-extra;return {title:'Special-order contribution',prompt:`A special order offers K${offer.toLocaleString()} per unit for ${units.toLocaleString()} units. Relevant variable cost is K${varc.toLocaleString()} per unit and the order causes extra fixed cost of ${money(extra)}. Calculate incremental profit/(loss).`,units:'K',answer:ans,display:money(ans),hint:'Incremental revenue minus ALL costs caused by the order.',steps:[`Incremental unit contribution = K${offer.toLocaleString()} − K${varc.toLocaleString()} = K${(offer-varc).toLocaleString()}.`,`Total before extra fixed cost = ${money((offer-varc)*units)}.`,`Less extra fixed cost ${money(extra)} = ${money(ans)}.`],explain:ans>=0?'Financially positive before qualitative factors.':'Financially negative on the information given.'}}default:return theoryDrill(n,'Explain the core idea of this chapter.','Use the chapter walkthrough and flashcards.')}}
function theoryDrill(n,prompt,...opts){const answer=opts[1]||opts[0];return {title:'Theory recall',prompt:`${prompt} Choose the correct answer mentally, then type the exact key phrase. Options: ${opts.join(' | ')}`,units:'text drill — use flashcards for marking',answer:0,display:answer,hint:`Correct key phrase: ${answer}`,steps:[`State the term clearly: ${answer}.`,`Then explain why it fits the requirement in one sentence.`],explain:'Theory drills are best self-marked using the key phrase.'}}
document.addEventListener('DOMContentLoaded',init);
</script>
